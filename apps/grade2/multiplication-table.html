<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乘法口诀背诵</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee; padding: 1rem;
    }
    .container {
      padding: 2rem 2rem; width: min(480px, 96vw);
      background: rgba(255,255,255,0.06); border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; font-size: 1.4rem; color: #ffd166; margin-bottom: 0.3rem; }
    .hint { text-align: center; font-size: 0.78rem; color: #888; margin-bottom: 1rem; line-height: 1.5; }
    .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem 1.8rem; margin-bottom: 1rem; }
    .stat-label { font-size: 0.72rem; color: #888; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #06d6a0; text-align: center; }
    .stat-value.prof { color: #ffd166; }
    .stat-value.item { color: #a8dadc; font-size: 1.2rem; }
    .card {
      padding: 1.5rem 1rem; background: rgba(0,0,0,0.25); border-radius: 14px; margin-bottom: 0.8rem;
      text-align: center;
    }
    .question {
      font-family: "Courier New", monospace; font-size: 2.4rem; font-weight: 700;
      color: #a8dadc; margin-bottom: 1rem;
    }
    .question .eq { color: #888; font-weight: 400; margin: 0 0.35rem; }
    .answer-row { display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .answer-row input {
      width: 5rem; padding: 0.55rem 0.4rem; border: 2px solid rgba(168,218,220,0.35);
      border-radius: 10px; background: rgba(0,0,0,0.3); color: #ffd166;
      font-family: "Courier New", monospace; font-size: 2rem; font-weight: 700; text-align: center;
    }
    .answer-row input:focus { outline: none; border-color: #ffd166; }
    .answer-row input:disabled { opacity: 0.55; }
    .reveal {
      margin-top: 1rem; font-size: 1.35rem; color: #ffd166; font-weight: 700;
      min-height: 1.8rem; letter-spacing: 0.08em;
    }
    .actions { display: flex; justify-content: center; gap: 0.6rem; margin-top: 1rem; }
    .btn {
      padding: 0.55rem 1.1rem; border: none; border-radius: 10px; font-size: 0.92rem;
      font-weight: 600; cursor: pointer; background: #a8dadc; color: #1a1a2e;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.ghost {
      background: transparent; color: #a8dadc;
      border: 1px solid rgba(168,218,220,0.35);
    }
    .status { text-align: center; margin-top: 0.7rem; min-height: 1.3rem; font-size: 0.92rem; }
    .status.ok { color: #06d6a0; }
    .status.err { color: #ef476f; }
    .status.info { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✖️ 乘法口诀背诵</h1>
    <p class="hint">连对 10 次该口诀熟练度 100% · 不熟的口诀出现概率更高</p>
    <div class="stats">
      <div>
        <div class="stat-label">分数</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div>
        <div class="stat-label">整表熟练度</div>
        <div class="stat-value prof" id="totalProf">0%</div>
      </div>
      <div>
        <div class="stat-label">本题熟练度</div>
        <div class="stat-value item" id="itemProf">0%</div>
      </div>
    </div>
    <div class="card">
      <div class="question" id="question"></div>
      <div class="answer-row">
        <input type="text" id="answer" inputmode="numeric" autocomplete="off" placeholder="?">
      </div>
      <div class="reveal" id="reveal"></div>
      <div class="actions">
        <button class="btn ghost" id="showBtn" type="button">看答案</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script src="../../practice-stats-store.js"></script>
  <script>
    const LS_KEY = "mul-table-recite";
    const BASE_EXP = 0.001;
    const STREAK_MAX = 10;
    const REVEAL_MS = 3000;
    const OK_MS = 900;
    const SCORE_STEP = 0.25;
    const MISS_LIMIT = 3;

    const CN = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

    const ITEMS = [];
    for (let a = 1; a <= 9; a++) {
      for (let b = 1; b <= 9; b++) {
        ITEMS.push({ a, b, id: `${a}x${b}` });
      }
    }

    let store = {};
    let prof = null;
    let current = null;
    let locked = false;
    let timer = null;
    let missCount = 0;

    const questionEl = document.getElementById("question");
    const answerEl = document.getElementById("answer");
    const revealEl = document.getElementById("reveal");
    const statusEl = document.getElementById("status");
    const showBtn = document.getElementById("showBtn");
    const totalProfEl = document.getElementById("totalProf");
    const itemProfEl = document.getElementById("itemProf");
    const scoreEl = document.getElementById("score");

    function cnNum(n) {
      if (n < 10) return CN[n];
      if (n === 10) return "一十";
      if (n < 20) return "十" + CN[n - 10];
      if (n % 10 === 0) return CN[n / 10] + "十";
      return CN[Math.floor(n / 10)] + "十" + CN[n % 10];
    }

    function koujue(a, b) {
      const lo = Math.min(a, b);
      const hi = Math.max(a, b);
      const p = a * b;
      const head = CN[lo] + CN[hi];
      return p < 10 ? head + "得" + CN[p] : head + cnNum(p);
    }

    function assignDisplayOrder() {
      if (current.a === current.b) {
        current.da = current.a;
        current.db = current.b;
      } else if (Math.random() < 0.5) {
        current.da = current.a;
        current.db = current.b;
      } else {
        current.da = current.b;
        current.db = current.a;
      }
    }

    function loadStore() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) store = JSON.parse(raw);
      } catch (_) {}
      if (!store || typeof store !== "object") store = {};
    }

    function saveStore() {
      localStorage.setItem(LS_KEY, JSON.stringify(store));
    }

    function streakOf(item) {
      return store[item.id]?.streak || 0;
    }

    function profOf(item) {
      return Math.min(streakOf(item), STREAK_MAX) * (100 / STREAK_MAX);
    }

    function totalProficiency() {
      if (!ITEMS.length) return 0;
      const sum = ITEMS.reduce((s, it) => s + profOf(it), 0);
      return Math.round(sum / ITEMS.length);
    }

    function itemExp(item) {
      const prof = profOf(item) / 100;
      return BASE_EXP + (1 - prof);
    }

    function pickItem() {
      const exps = ITEMS.map(itemExp);
      const sum = exps.reduce((s, e) => s + e, 0);
      let r = Math.random() * sum;
      for (let i = 0; i < ITEMS.length; i++) {
        r -= exps[i];
        if (r <= 0) return ITEMS[i];
      }
      return ITEMS[ITEMS.length - 1];
    }

    function scoreOf() {
      return store.score || 0;
    }

    function formatScore(s) {
      const n = Math.round(s * 4) / 4;
      return n.toFixed(2).replace(/\.?0+$/, "");
    }

    function renderStats() {
      scoreEl.textContent = formatScore(scoreOf());
      totalProfEl.textContent = totalProficiency() + "%";
      itemProfEl.textContent = current ? profOf(current) + "%" : "—";
    }

    function clearTimer() {
      if (timer) { clearTimeout(timer); timer = null; }
    }

    function setLocked(v) {
      locked = v;
      answerEl.disabled = v;
      showBtn.disabled = v;
    }

    function resetStreak(item) {
      store[item.id] = { streak: 0 };
      saveStore();
    }

    function bumpStreak(item) {
      const streak = Math.min(STREAK_MAX, streakOf(item) + 1);
      store[item.id] = { streak };
      saveStore();
    }

    function showQuestion() {
      clearTimer();
      locked = false;
      missCount = 0;
      revealEl.textContent = "";
      statusEl.textContent = "";
      statusEl.className = "status";
      answerEl.value = "";
      answerEl.disabled = false;
      showBtn.disabled = false;
      questionEl.innerHTML =
        `${current.da}<span class="eq">×</span>${current.db}<span class="eq">=</span>`;
      renderStats();
      answerEl.focus();
    }

    function nextQuestion() {
      current = pickItem();
      assignDisplayOrder();
      showQuestion();
    }

    function scheduleNext(ms) {
      clearTimer();
      setLocked(true);
      timer = setTimeout(() => {
        timer = null;
        nextQuestion();
      }, ms);
    }

    function onCorrect() {
      store.score = Math.round((scoreOf() + SCORE_STEP) * 4) / 4;
      saveStore();
      bumpStreak(current);
      if (prof) prof.record(true);
      renderStats();
      statusEl.textContent = `对了！${koujue(current.a, current.b)} · 连对 ${streakOf(current)}/${STREAK_MAX}`;
      statusEl.className = "status ok";
      scheduleNext(OK_MS);
    }

    function onWrong() {
      missCount++;
      resetStreak(current);
      if (missCount >= MISS_LIMIT) {
        if (prof) prof.record(false);
        renderStats();
        revealEl.textContent = koujue(current.a, current.b);
        statusEl.textContent = `连续错 ${MISS_LIMIT} 次，跳过。${current.da} × ${current.db} = ${current.da * current.db}`;
        statusEl.className = "status err";
        scheduleNext(REVEAL_MS);
        return;
      }
      renderStats();
      statusEl.textContent = `不对，再想想。（${missCount}/${MISS_LIMIT}）`;
      statusEl.className = "status err";
      answerEl.value = "";
      answerEl.focus();
    }

    function onReveal() {
      if (locked || !current) return;
      resetStreak(current);
      if (prof) prof.record(false);
      renderStats();
      revealEl.textContent = koujue(current.a, current.b);
      statusEl.textContent = `${current.da} × ${current.db} = ${current.da * current.db}，3 秒后下一题`;
      statusEl.className = "status info";
      scheduleNext(REVEAL_MS);
    }

    function checkAnswer() {
      if (locked || !current) return;
      const raw = answerEl.value.trim();
      if (!raw) return;
      const v = parseInt(raw, 10);
      if (!Number.isFinite(v)) return;
      const expected = current.a * current.b;
      if (v === expected) {
        onCorrect();
        return;
      }
      if (raw.length >= String(expected).length) onWrong();
    }

    answerEl.addEventListener("input", checkAnswer);
    showBtn.addEventListener("click", onReveal);

    loadStore();
    PracticeStats.init("../../data/practice-stats.json").then(() => {
      prof = PracticeStats.create();
      renderStats();
      nextQuestion();
    });
  </script>
</body>
</html>
