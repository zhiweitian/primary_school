<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混合运算</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee; padding: 1rem;
    }
    .container {
      padding: 2rem 1.6rem; width: min(520px, 96vw);
      background: rgba(255,255,255,0.06); border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; font-size: 1.4rem; color: #ffd166; margin-bottom: 0.3rem; }
    .hint { text-align: center; font-size: 0.78rem; color: #888; margin-bottom: 0.45rem; line-height: 1.5; }
    .mode { text-align: center; font-size: 0.72rem; color: #ffd166; margin-bottom: 1rem; min-height: 1.1rem; }
    .mode.off { color: #06d6a0; }
    .stats { display: flex; justify-content: center; gap: 1.6rem; margin-bottom: 1rem; }
    .stat-label { font-size: 0.72rem; color: #888; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #06d6a0; text-align: center; }
    .stat-value.prof { color: #ffd166; }
    .card {
      padding: 1.2rem 1rem; background: rgba(0,0,0,0.25); border-radius: 14px; margin-bottom: 0.9rem;
    }
    .ask { text-align: center; font-size: 0.92rem; color: #888; margin-bottom: 0.7rem; min-height: 1.3rem; }
    .expr {
      text-align: center; font-family: "Courier New", monospace;
      font-size: 2rem; font-weight: 700; color: #a8dadc; margin-bottom: 0.95rem;
    }
    .expr .hl {
      color: #ffd166; padding: 0.05em 0.15em; border-radius: 6px;
      background: rgba(255, 209, 102, 0.16); box-shadow: inset 0 -3px 0 #ffd166;
    }
    .fill { display: flex; justify-content: center; align-items: center; gap: 0.4rem; }
    .fill input {
      width: 4.2rem; padding: 0.4rem 0.2rem; border: 2px solid rgba(168,218,220,0.35);
      border-radius: 10px; background: rgba(0,0,0,0.3); color: #ffd166;
      font-family: "Courier New", monospace; font-size: 1.7rem; font-weight: 700; text-align: center;
    }
    .fill input:focus { outline: none; border-color: #ffd166; }
    .fill input:disabled { opacity: 0.55; }
    .actions { display: flex; justify-content: center; margin-top: 0.9rem; }
    .btn {
      min-width: 5.4rem; padding: 0.62rem 1rem; border: none; border-radius: 10px;
      font-size: 1.05rem; font-weight: 700; cursor: pointer; background: #a8dadc; color: #1a1a2e;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .status { text-align: center; margin-top: 0.7rem; min-height: 1.3rem; font-size: 0.92rem; }
    .status.ok { color: #06d6a0; }
    .status.err { color: #ef476f; }
    .btn-next {
      display: none; margin: 0.65rem auto 0; padding: 0.45rem 1.3rem;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: transparent;
      color: #a8dadc; cursor: pointer;
    }
    .btn-next.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>＋× 混合运算</h1>
    <p class="hint">先乘除、后加减；有括号先算括号。同级从左到右</p>
    <p class="mode" id="mode"></p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card">
      <div class="ask" id="ask"></div>
      <div class="expr" id="expr"></div>
      <div class="fill">
        <input id="ans" inputmode="numeric" maxlength="3" autocomplete="off">
      </div>
      <div class="actions"><button class="btn" id="okBtn" type="button">确定</button></div>
    </div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script>
    let prof, profUI, q = null, step = 0, hint = true, answered = false, timer = null, lastKey = "";
    const AUTO_MS = 1400;

    function rand(a, b) {
      return a + Math.floor(Math.random() * (b - a + 1));
    }

    function needHint() {
      const s = prof.stats();
      if (!s.total || s.total < 8) return true;
      return s.proficiency == null || s.proficiency < 80;
    }

    function mulFirst() {
      const b = rand(2, 6), c = rand(2, 6), prod = b * c;
      if (Math.random() < 0.5) {
        const a = rand(2, 20);
        if (a > prod && Math.random() < 0.45) {
          return {
            key: "s-" + a + "-" + b + "-" + c,
            show: a + " - " + b + " × " + c,
            hl: a + " - <span class=\"hl\">" + b + " × " + c + "</span>",
            after: a + " - " + prod,
            first: prod,
            final: a - prod
          };
        }
        return {
          key: "a-" + a + "-" + b + "-" + c,
          show: a + " + " + b + " × " + c,
          hl: a + " + <span class=\"hl\">" + b + " × " + c + "</span>",
          after: a + " + " + prod,
          first: prod,
          final: a + prod
        };
      }
      const a = rand(2, 6), d = rand(2, 6), prod2 = a * d, e = rand(1, 9);
      if (prod2 > e && Math.random() < 0.45) {
        return {
          key: "ms-" + a + "-" + d + "-" + e,
          show: a + " × " + d + " - " + e,
          hl: "<span class=\"hl\">" + a + " × " + d + "</span> - " + e,
          after: prod2 + " - " + e,
          first: prod2,
          final: prod2 - e
        };
      }
      return {
        key: "ma-" + a + "-" + d + "-" + e,
        show: a + " × " + d + " + " + e,
        hl: "<span class=\"hl\">" + a + " × " + d + "</span> + " + e,
        after: prod2 + " + " + e,
        first: prod2,
        final: prod2 + e
      };
    }

    function paren() {
      if (Math.random() < 0.5) {
        const s = rand(2, 9), a = rand(1, s - 1), b = s - a, c = rand(2, 9);
        return {
          key: "p1-" + a + "-" + b + "-" + c,
          show: "(" + a + " + " + b + ") × " + c,
          hl: "<span class=\"hl\">(" + a + " + " + b + ")</span> × " + c,
          after: s + " × " + c,
          first: s,
          final: s * c
        };
      }
      const inner = rand(2, 9), y = rand(1, inner - 1), z = inner - y, x = rand(2, 9);
      return {
        key: "p2-" + x + "-" + y + "-" + z,
        show: x + " × (" + y + " + " + z + ")",
        hl: x + " × <span class=\"hl\">(" + y + " + " + z + ")</span>",
        after: x + " × " + inner,
        first: inner,
        final: x * inner
      };
    }

    function sameLevel() {
      if (Math.random() < 0.5) {
        const a = rand(6, 20), b = rand(1, 9), sum = a + b, c = rand(1, Math.min(9, sum - 1));
        return {
          key: "lr-" + a + "-" + b + "-" + c,
          show: a + " + " + b + " - " + c,
          hl: "<span class=\"hl\">" + a + " + " + b + "</span> - " + c,
          after: sum + " - " + c,
          first: sum,
          final: sum - c
        };
      }
      const a = rand(2, 9), b = rand(2, 9), prod = a * b;
      const ds = [];
      for (let d = 2; d <= 9; d++) if (prod % d === 0) ds.push(d);
      const d = ds[rand(0, ds.length - 1)];
      return {
        key: "md-" + a + "-" + b + "-" + d,
        show: a + " × " + b + " ÷ " + d,
        hl: "<span class=\"hl\">" + a + " × " + b + "</span> ÷ " + d,
        after: prod + " ÷ " + d,
        first: prod,
        final: prod / d
      };
    }

    function makeQ() {
      let item, n = 0;
      do {
        const r = Math.random();
        item = r < 0.45 ? mulFirst() : r < 0.8 ? paren() : sameLevel();
        n++;
      } while (item.key === lastKey && n < 8);
      lastKey = item.key;
      return item;
    }

    function showQ() {
      const expr = document.getElementById("expr");
      const ask = document.getElementById("ask");
      const box = document.getElementById("ans");
      box.value = "";
      box.disabled = false;
      document.getElementById("okBtn").disabled = false;
      document.getElementById("status").textContent = "";
      document.getElementById("status").className = "status";
      document.getElementById("nextBtn").classList.remove("show");
      if (hint && step === 0) {
        ask.textContent = "先算高亮的部分";
        expr.innerHTML = q.hl;
      } else if (hint && step === 1) {
        ask.textContent = "再算";
        expr.textContent = q.after;
      } else {
        ask.textContent = "得数是多少？";
        expr.textContent = q.show;
      }
      box.focus();
    }

    function render() {
      if (timer) { clearTimeout(timer); timer = null; }
      answered = false;
      hint = needHint();
      step = 0;
      q = makeQ();
      const mode = document.getElementById("mode");
      if (hint) {
        mode.textContent = "提示开着：先填高亮的一步";
        mode.className = "mode";
      } else {
        mode.textContent = "自己算：直接填得数";
        mode.className = "mode off";
      }
      showQ();
    }

    function finish(ok) {
      if (answered) return;
      answered = true;
      document.getElementById("ans").disabled = true;
      document.getElementById("okBtn").disabled = true;
      document.getElementById("nextBtn").disabled = false;
      const st = document.getElementById("status");
      prof.record(ok);
      profUI.render();
      if (ok) {
        st.textContent = "答对了！";
        st.className = "status ok";
        timer = setTimeout(render, AUTO_MS);
      } else {
        st.textContent = q.show + " = " + q.final;
        st.className = "status err";
        document.getElementById("nextBtn").classList.add("show");
      }
    }

    function submit() {
      if (answered) return;
      const v = +document.getElementById("ans").value;
      if (hint && step === 0) {
        if (v === q.first) {
          step = 1;
          showQ();
          return;
        }
        finish(false);
        return;
      }
      finish(v === q.final);
    }

    document.getElementById("okBtn").onclick = submit;
    document.getElementById("ans").addEventListener("keydown", e => {
      if (e.key === "Enter") submit();
    });
    document.getElementById("nextBtn").onclick = render;

    PracticeStats.init("../../data/practice-stats.json").then(() => {
      prof = PracticeStats.create();
      profUI = prof.bind(
        document.getElementById("totalDone"),
        document.getElementById("proficiency")
      );
      render();
    });
  </script>
</body>
</html>
