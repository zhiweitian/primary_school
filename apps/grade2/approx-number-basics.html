<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认识近似数</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee;
    }
    .container {
      padding: 2rem 2.5rem; width: min(560px, 94vw);
      background: rgba(255,255,255,0.06); border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; font-size: 1.45rem; color: #ffd166; margin-bottom: 0.35rem; }
    .hint { text-align: center; font-size: 0.78rem; color: #888; margin-bottom: 1rem; }
    .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem 2rem; margin-bottom: 1rem; }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
    .stat-label { font-size: 0.72rem; color: #888; }
    .stat-value { font-size: 1.6rem; font-weight: 700; color: #06d6a0; }
    .stat-value.prof { color: #ffd166; }
    .goal {
      text-align: center; font-size: 0.9rem; color: #ddd; margin-bottom: 0.75rem;
    }
    .goal .num-hl { color: #ffd166; font-weight: 700; font-family: "Courier New", monospace; }
    .goal .unit-hl { color: #a8dadc; font-weight: 600; }
    .worksheet {
      font-family: "Courier New", Courier, monospace;
      font-size: 2rem; font-weight: 600;
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem;
      padding: 1.4rem 2rem; background: rgba(0,0,0,0.25); border-radius: 12px;
      cursor: text; user-select: none;
    }
    .row { display: flex; align-items: center; }
    .cell {
      width: 2.2rem; height: 2.6rem;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .cell.carry {
      height: 1.4rem; font-size: 0.95rem; color: #f4a261; font-weight: 500;
    }
    .cell.carry .digit { min-height: 1.2rem; }
    .cell.carry.filled .digit { color: #ffd166; }
    .cell.static .digit { color: #a8dadc; }
    .cell.place {
      height: 1.5rem; font-size: 0.75rem; font-weight: 500; color: #666;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
    }
    .cell.place.target { color: #ffd166; font-weight: 700; }
    .cell.place.look { color: #f4a261; font-weight: 700; }
    .cell.place.active { color: #a8dadc; font-weight: 700; }
    .cell.answer { border-bottom: 2px solid transparent; }
    .cell.answer.active {
      background: rgba(168, 218, 220, 0.15);
      border-bottom-color: #a8dadc; border-radius: 4px 4px 0 0;
    }
    .cell.answer.correct .digit { color: #06d6a0; }
    .cell.answer.wrong { animation: shake 0.35s ease; }
    .cell.answer.wrong .digit { color: #ef476f; }
    .spacer { width: 2rem; }
    .line-row { width: 100%; padding: 0.2rem 0 0.4rem; }
    .line-row hr { border: none; border-top: 3px solid rgba(255,255,255,0.5); width: 100%; }
    .digit { min-width: 1ch; text-align: center; }
    .buffer {
      text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #888; min-height: 1.2rem;
    }
    .buffer span { color: #a8dadc; }
    .status { text-align: center; margin-top: 0.6rem; min-height: 1.3rem; font-size: 0.92rem; }
    .status.ok { color: #06d6a0; }
    .status.err { color: #ef476f; }
    #hiddenInput { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .worksheet.done { animation: pop 0.4s ease; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📐 认识近似数</h1>
    <p class="hint">从个位开始填写；满 5 时在判断位连打两位（先写进位、再写 0），与加法进位相同</p>
    <div class="stats">
      <div class="stat">
        <span class="stat-label">做题数</span>
        <span class="stat-value" id="totalDone">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">熟练度</span>
        <span class="stat-value prof" id="proficiency">—</span>
      </div>
    </div>
    <div class="goal" id="goal"></div>
    <div class="worksheet" id="worksheet" tabindex="0">
      <div class="row" id="placeRow"></div>
      <div class="row" id="origRow"></div>
      <div class="row" id="carryRow"></div>
      <div class="line-row"><hr></div>
      <div class="row" id="answerRow"></div>
    </div>
    <div class="buffer" id="buffer"></div>
    <div class="status" id="status"></div>
  </div>
  <input type="text" id="hiddenInput" inputmode="numeric" autocomplete="off">
  <script src="../../practice-stats-store.js"></script>
  <script>
    let prof, profUI;
    const UNITS = [
      { name: "整十数", step: 10 },
      { name: "整百数", step: 100 },
      { name: "整千数", step: 1000 }
    ];
    const PLACE_NAMES = ["个", "十", "百", "千", "万"];
    const NINE_CARRY_RATE = 0.35;
    const AUTO_MS = 1400;

    const worksheet = document.getElementById("worksheet");
    const hiddenInput = document.getElementById("hiddenInput");
    const bufferEl = document.getElementById("buffer");
    const statusEl = document.getElementById("status");
    const goalEl = document.getElementById("goal");

    let n = 0, answer = 0, unit = null;
    let colCount = 0, targetCol = 0, lookCol = 0, willCarry = false;
    let currentCol = 0, digitBuffer = "";
    let answerDigits = [];
    let carryIn = [];

    function roundTo(x, step) {
      return Math.round(x / step) * step;
    }

    function digitAtCol(num, colFromRight) {
      const s = String(num);
      const i = s.length - 1 - colFromRight;
      return i >= 0 ? +s[i] : 0;
    }

    function setDigit(x, power, d) {
      const cur = Math.floor(x / power) % 10;
      return x - cur * power + d * power;
    }

    function buildNineCarry(u) {
      const min = u.step === 10 ? 11 : u.step === 100 ? 101 : 1001;
      let num = min + Math.floor(Math.random() * (9999 - min + 1));
      num = setDigit(num, u.step, 9);
      num = setDigit(num, u.step / 10, 5 + Math.floor(Math.random() * 5));
      return num;
    }

    function pickNumber(u) {
      const min = u.step === 10 ? 11 : u.step === 100 ? 101 : 1001;
      let num = Math.random() < NINE_CARRY_RATE
        ? buildNineCarry(u)
        : Math.floor(Math.random() * (9999 - min + 1)) + min;
      while (roundTo(num, u.step) === num) num += u.step <= 100 ? 7 : 123;
      return num;
    }

    function targetColFor(step) {
      if (step === 10) return 1;
      if (step === 100) return 2;
      return 3;
    }

    function placeLabel(col) {
      return PLACE_NAMES[col] ?? "";
    }

    function padLeft(str, len) {
      return str.padStart(len, " ");
    }

    function makeCell(text, cls) {
      const cell = document.createElement("div");
      cell.className = "cell " + cls;
      const span = document.createElement("span");
      span.className = "digit";
      span.textContent = text === " " ? "" : text;
      cell.appendChild(span);
      return cell;
    }

    function incomingCarry(col) {
      return col > 0 && carryIn[col] !== null ? carryIn[col] : 0;
    }

    function expectedAt(col) {
      if (col < lookCol) return { result: 0, carry: 0 };
      if (col === lookCol && willCarry) return { result: 0, carry: 1 };
      if (col === lookCol) return { result: digitAtCol(answer, col), carry: 0 };
      if (col >= targetCol) {
        const d = digitAtCol(n, col) + incomingCarry(col);
        return { result: d % 10, carry: Math.floor(d / 10) };
      }
      return { result: digitAtCol(answer, col), carry: 0 };
    }

    function render() {
      const nStr = padLeft(String(n), colCount);
      const placeRow = document.getElementById("placeRow");
      const carryRow = document.getElementById("carryRow");
      const origRow = document.getElementById("origRow");
      const answerRow = document.getElementById("answerRow");

      placeRow.innerHTML = "";
      origRow.innerHTML = "";
      carryRow.innerHTML = "";
      answerRow.innerHTML = "";

      placeRow.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));
      origRow.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));
      carryRow.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));
      answerRow.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));

      for (let i = 0; i < colCount; i++) {
        const col = colCount - 1 - i;

        const pCell = makeCell(placeLabel(col), "place");
        if (col === targetCol) pCell.classList.add("target");
        if (col === lookCol && willCarry) pCell.classList.add("look");
        if (col === currentCol) pCell.classList.add("active");
        placeRow.appendChild(pCell);

        origRow.appendChild(makeCell(nStr[i], "static"));

        const showCarryIn = col > 0;
        const cCell = makeCell(
          showCarryIn && carryIn[col] !== null ? carryIn[col] : "",
          "carry"
        );
        if (showCarryIn && carryIn[col] !== null) cCell.classList.add("filled");
        carryRow.appendChild(cCell);

        const aCell = makeCell(answerDigits[col] ?? "", "answer");
        if (col === currentCol) aCell.classList.add("active");
        if (answerDigits[col] !== null) {
          const exp = expectedAt(col);
          if (+answerDigits[col] === exp.result) aCell.classList.add("correct");
        }
        answerRow.appendChild(aCell);
      }
    }

    function focusInput() {
      hiddenInput.value = "";
      hiddenInput.focus();
    }

    function updateBuffer() {
      const place = placeLabel(currentCol);
      const exp = expectedAt(currentCol);
      const cin = incomingCarry(currentCol);
      let hint;
      if (currentCol < lookCol) {
        hint = `填 <span>0</span>`;
      } else if (currentCol === lookCol && willCarry) {
        hint = `满 5 进位，连打两位：先写进位，再写 <span>0</span>`;
      } else if (exp.carry > 0) {
        hint = cin > 0
          ? `加上进位 ${cin} 后再进位，连打两位：先写进位，再写本位列`
          : `连打两位：先写进位，再写本位列`;
      } else if (cin > 0) {
        hint = `加上进位 <span>${cin}</span> 写结果`;
      } else if (currentCol > targetCol) {
        hint = `保留这一位`;
      } else if (currentCol === targetCol && willCarry) {
        hint = `目标位加进位写结果`;
      } else {
        hint = `填 <span>0</span>`;
      }
      bufferEl.innerHTML = digitBuffer
        ? `当前输入：<span>${digitBuffer}</span>`
        : `正在填写<span>${place}</span>位 · ${hint}`;
    }

    function finishProblem() {
      prof.record(true);
      profUI.render();
      statusEl.textContent = `正确！${n} 近似成${unit.name}是 ${answer}`;
      statusEl.className = "status ok";
      worksheet.classList.add("done");
      setTimeout(newProblem, AUTO_MS);
    }

    function processColumn() {
      const exp = expectedAt(currentCol);
      let resultDigit, carryDigit;

      if (digitBuffer.length === 2) {
        carryDigit = +digitBuffer[0];
        resultDigit = +digitBuffer[1];
      } else {
        resultDigit = +digitBuffer[0];
        carryDigit = 0;
      }

      const resultOk = resultDigit === exp.result;
      const carryOk = exp.carry === 0 ? carryDigit === 0 : carryDigit === exp.carry;

      if (!resultOk || !carryOk) {
        statusEl.textContent = "这一位不对，再试一次";
        statusEl.className = "status err";
        digitBuffer = "";
        updateBuffer();
        document.querySelectorAll(".cell.answer.active").forEach(c => {
          c.classList.add("wrong");
          setTimeout(() => c.classList.remove("wrong"), 350);
        });
        return;
      }

      answerDigits[currentCol] = resultDigit;
      if (exp.carry > 0 && currentCol + 1 < carryIn.length) {
        carryIn[currentCol + 1] = carryDigit;
      }

      digitBuffer = "";
      statusEl.textContent = "";
      statusEl.className = "status";

      if (currentCol + 1 >= colCount) {
        finishProblem();
      } else {
        currentCol++;
        updateBuffer();
      }
      render();
    }

    function onDigit(d) {
      if (worksheet.classList.contains("done")) return;
      digitBuffer += d;
      updateBuffer();
      const exp = expectedAt(currentCol);
      const needTwo = exp.carry > 0;
      if (digitBuffer.length === 2 || (digitBuffer.length === 1 && !needTwo)) {
        processColumn();
      }
    }

    function newProblem() {
      unit = UNITS[Math.floor(Math.random() * UNITS.length)];
      n = pickNumber(unit);
      answer = roundTo(n, unit.step);
      targetCol = targetColFor(unit.step);
      lookCol = targetCol - 1;
      willCarry = digitAtCol(n, lookCol) >= 5;
      colCount = Math.max(String(n).length, String(answer).length);
      currentCol = 0;
      digitBuffer = "";
      answerDigits = Array(colCount).fill(null);
      carryIn = Array(colCount).fill(null);

      goalEl.innerHTML =
        `把 <span class="num-hl">${n}</span> 近似成<span class="unit-hl">${unit.name}</span>`;

      statusEl.textContent = "";
      statusEl.className = "status";
      worksheet.classList.remove("done");
      updateBuffer();
      render();
      focusInput();
    }

    hiddenInput.addEventListener("input", () => {
      const val = hiddenInput.value.replace(/\D/g, "");
      hiddenInput.value = "";
      for (const ch of val) onDigit(ch);
    });

    hiddenInput.addEventListener("keydown", e => {
      if (e.key === "Backspace" && digitBuffer.length > 0) {
        e.preventDefault();
        digitBuffer = "";
        updateBuffer();
      }
    });

    worksheet.addEventListener("click", focusInput);
    document.addEventListener("click", e => {
      if (!worksheet.contains(e.target)) focusInput();
    });

    PracticeStats.init("../../data/practice-stats.json").then(() => {
      prof = PracticeStats.create();
      profUI = prof.bind(
        document.getElementById("totalDone"),
        document.getElementById("proficiency")
      );
      newProblem();
    });
  </script>
</body>
</html>
