<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乘除关系</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee; padding: 1rem;
    }
    .container {
      padding: 2rem 1.6rem; width: min(520px, 96vw);
      background: rgba(255,255,255,0.06); border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; font-size: 1.4rem; color: #ffd166; margin-bottom: 0.3rem; }
    .hint { text-align: center; font-size: 0.78rem; color: #888; margin-bottom: 1rem; line-height: 1.5; }
    .stats { display: flex; justify-content: center; gap: 1.6rem; margin-bottom: 1rem; }
    .stat-label { font-size: 0.72rem; color: #888; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #06d6a0; text-align: center; }
    .stat-value.prof { color: #ffd166; }
    .card {
      padding: 1.2rem 1rem; background: rgba(0,0,0,0.25); border-radius: 14px; margin-bottom: 0.9rem;
    }
    .ask { text-align: center; font-size: 1.05rem; line-height: 1.6; color: #ddd; margin-bottom: 0.85rem; }
    .ask .eq { font-family: "Courier New", monospace; font-size: 1.35rem; font-weight: 700; color: #a8dadc; }
    .array {
      display: grid; grid-template: auto 1fr / auto 1fr;
      width: fit-content; margin: 0.1rem auto 0.95rem; gap: 0.35rem 0.5rem;
      justify-items: center; align-items: center;
    }
    .array .top, .array .side { color: #a8dadc; font-size: 0.82rem; font-weight: 600; }
    .array .side { writing-mode: vertical-rl; letter-spacing: 0.08em; }
    .grid {
      display: grid; gap: 0.28rem; padding: 0.4rem;
      border: 1px dashed rgba(168,218,220,0.35); border-radius: 10px;
    }
    .dot { width: 0.72rem; height: 0.72rem; border-radius: 50%; background: #ffd166; }
    .eqs { display: flex; flex-direction: column; gap: 0.55rem; align-items: center; }
    .fill {
      display: flex; justify-content: center; align-items: center; gap: 0.3rem; flex-wrap: wrap;
    }
    .fill input {
      width: 3.1rem; padding: 0.32rem 0.15rem; border: 2px solid rgba(168,218,220,0.35);
      border-radius: 10px; background: rgba(0,0,0,0.3); color: #ffd166;
      font-family: "Courier New", monospace; font-size: 1.45rem; font-weight: 700; text-align: center;
    }
    .fill input:focus { outline: none; border-color: #ffd166; }
    .fill input:disabled { opacity: 0.55; }
    .op { font-size: 1.25rem; color: #888; font-weight: 700; }
    .btn {
      min-width: 5.2rem; padding: 0.62rem 1rem; border: none; border-radius: 10px;
      font-size: 1.02rem; font-weight: 700; cursor: pointer; background: #a8dadc; color: #1a1a2e;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .actions { display: flex; justify-content: center; margin-top: 0.9rem; }
    .status { text-align: center; margin-top: 0.7rem; min-height: 1.3rem; font-size: 0.92rem; }
    .status.ok { color: #06d6a0; }
    .status.err { color: #ef476f; }
    .btn-next {
      display: none; margin: 0.65rem auto 0; padding: 0.45rem 1.3rem;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: transparent;
      color: #a8dadc; cursor: pointer;
    }
    .btn-next.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✖️➗ 乘除关系</h1>
    <p class="hint">点子排成方阵：横着是几行，竖着是每行几个。3×4＝4×3＝12，12÷4＝3，12÷3＝4</p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card">
      <div class="ask" id="ask"></div>
      <div id="body"></div>
    </div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script>
    let prof, profUI, q = null, answered = false, timer = null, lastKey = "";
    const AUTO_MS = 1400;
    const CN = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

    function rand(a, b) {
      return a + Math.floor(Math.random() * (b - a + 1));
    }

    function pair() {
      let cols = rand(2, 6), rows = rand(2, 6);
      if (cols === rows && Math.random() < 0.7) rows = cols === 6 ? 5 : cols + 1;
      return { cols, rows, p: cols * rows };
    }

    function koujue(a, b) {
      const x = Math.min(a, b), y = Math.max(a, b), p = a * b;
      const tail = p < 10 ? "得" + CN[p] : p === 10 ? "一十" : p < 20 ? "十" + CN[p % 10] : CN[Math.floor(p / 10)] + "十" + (p % 10 ? CN[p % 10] : "");
      return CN[x] + CN[y] + tail;
    }

    function makeQ() {
      const kinds = ["pic", "fromMul", "think"];
      let kind, cols, rows, p, key;
      do {
        kind = kinds[rand(0, 2)];
        ({ cols, rows, p } = pair());
        key = kind + "-" + cols + "-" + rows;
      } while (key === lastKey);
      lastKey = key;
      return { kind, cols, rows, p };
    }

    function row(op, ids) {
      return `<div class="fill">
        <input id="${ids[0]}" inputmode="numeric" maxlength="2" autocomplete="off">
        <span class="op">${op}</span>
        <input id="${ids[1]}" inputmode="numeric" maxlength="2" autocomplete="off">
        <span class="op">=</span>
        <input id="${ids[2]}" inputmode="numeric" maxlength="2" autocomplete="off">
      </div>`;
    }

    function arrayHtml() {
      const { cols, rows } = q;
      return `<div class="array">
        <div></div>
        <div class="top">每行 ${cols} 个</div>
        <div class="side">${rows} 行</div>
        <div class="grid" style="grid-template-columns:repeat(${cols},0.72rem)">${
          "<div class='dot'></div>".repeat(cols * rows)
        }</div>
      </div>`;
    }

    function read3(a, b, p) {
      return [+document.getElementById(a).value, +document.getElementById(b).value, +document.getElementById(p).value];
    }

    function mulOk(a, b, p) {
      return p === q.p && ((a === q.rows && b === q.cols) || (a === q.cols && b === q.rows));
    }

    function mulPairOk(m1, m2) {
      const want = new Set([q.rows + "x" + q.cols + "=" + q.p, q.cols + "x" + q.rows + "=" + q.p]);
      const got = [m1[0] + "x" + m1[1] + "=" + m1[2], m2[0] + "x" + m2[1] + "=" + m2[2]];
      return want.has(got[0]) && want.has(got[1]) && got[0] !== got[1];
    }

    function divPairOk(d1, d2) {
      const want = new Set([q.p + "/" + q.cols + "=" + q.rows, q.p + "/" + q.rows + "=" + q.cols]);
      const got = [d1[0] + "/" + d1[1] + "=" + d1[2], d2[0] + "/" + d2[1] + "=" + d2[2]];
      return want.has(got[0]) && want.has(got[1]) && got[0] !== got[1];
    }

    function render() {
      if (timer) { clearTimeout(timer); timer = null; }
      answered = false;
      q = makeQ();
      const ask = document.getElementById("ask");
      const body = document.getElementById("body");
      document.getElementById("status").textContent = "";
      document.getElementById("status").className = "status";
      document.getElementById("nextBtn").classList.remove("show");

      if (q.kind === "pic") {
        ask.textContent = "横着看、竖着看，写出两道乘法和两道除法";
        body.innerHTML = arrayHtml() + `<div class="eqs">${row("×", ["m0", "m1", "m2"])}${row("×", ["n0", "n1", "n2"])}${row("÷", ["d0", "d1", "d2"])}${row("÷", ["e0", "e1", "e2"])}</div>`
          + `<div class="actions"><button class="btn" id="okBtn" type="button">确定</button></div>`;
        bind(() => mulPairOk(read3("m0", "m1", "m2"), read3("n0", "n1", "n2")) && divPairOk(read3("d0", "d1", "d2"), read3("e0", "e1", "e2")));
      } else if (q.kind === "fromMul") {
        ask.innerHTML = `根据方阵和 <span class="eq">${q.rows} × ${q.cols} = ${q.p}</span> 写出两道除法`;
        body.innerHTML = arrayHtml() + `<div class="eqs">${row("÷", ["d0", "d1", "d2"])}${row("÷", ["e0", "e1", "e2"])}</div>`
          + `<div class="actions"><button class="btn" id="okBtn" type="button">确定</button></div>`;
        bind(() => divPairOk(read3("d0", "d1", "d2"), read3("e0", "e1", "e2")));
      } else {
        const div = Math.random() < 0.5 ? q.cols : q.rows;
        const quo = div === q.cols ? q.rows : q.cols;
        q.div = div;
        q.quo = quo;
        const x = Math.min(div, quo);
        const tail = koujue(div, quo).slice(2);
        const hint = div === x ? CN[div] + "（　）" + tail : "（　）" + CN[div] + tail;
        ask.innerHTML = `一共 ${q.p} 个。<span class="eq">${q.p} ÷ ${div} = ？</span><br>想：${hint}`;
        body.innerHTML = arrayHtml() + `<div class="fill">
          <input id="ans" inputmode="numeric" maxlength="2" autocomplete="off">
        </div>
        <div class="actions"><button class="btn" id="okBtn" type="button">确定</button></div>`;
        bind(() => +document.getElementById("ans").value === quo);
      }
    }

    function bind(check) {
      const ok = () => {
        const tip = `${q.rows} × ${q.cols} = ${q.cols} × ${q.rows} = ${q.p}　${q.p} ÷ ${q.cols} = ${q.rows}　${q.p} ÷ ${q.rows} = ${q.cols}`;
        finish(check(), tip);
      };
      document.getElementById("okBtn").onclick = ok;
      document.querySelectorAll(".fill input").forEach(el => {
        el.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
      });
      const first = document.querySelector(".fill input");
      if (first) first.focus();
    }

    function finish(ok, tip) {
      if (answered) return;
      answered = true;
      document.querySelectorAll("button, input").forEach(el => { el.disabled = true; });
      document.getElementById("nextBtn").disabled = false;
      const st = document.getElementById("status");
      prof.record(ok);
      profUI.render();
      if (ok) {
        st.textContent = "答对了！";
        st.className = "status ok";
        timer = setTimeout(render, AUTO_MS);
      } else {
        st.textContent = tip;
        st.className = "status err";
        document.getElementById("nextBtn").classList.add("show");
      }
    }

    document.getElementById("nextBtn").onclick = render;
    PracticeStats.init("../../data/practice-stats.json").then(() => {
      prof = PracticeStats.create();
      profUI = prof.bind(
        document.getElementById("totalDone"),
        document.getElementById("proficiency")
      );
      render();
    });
  </script>
</body>
</html>
