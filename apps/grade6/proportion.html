<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比例</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand } = G1;
    G1.quiz({ title: "比例", hint: "表示两个比相等的式子叫比例；两个外项的积等于两个内项的积" }, () => {
      let a, b;
      do { a = rand(2, 9); b = rand(2, 12); } while (a === b);
      const k = rand(2, 6);
      const t = [a, b, a * k, b * k];
      if (Math.random() < 0.6) {
        const i = rand(0, 3), s = t.map((v, j) => (j === i ? "x" : v));
        const others = i === 0 || i === 3 ? [t[1], t[2], t[3 - i]] : [t[0], t[3], t[3 - i]];
        return { ask: `解比例：<span class="t">${s[0]} : ${s[1]} = ${s[2]} : ${s[3]}</span>`, fill: `<span class="t">x =</span>${G1.box("l")}`, ans: String(t[i]),
          tip: "外项积 = 内项积，再用方程解", why: `${others[0]} × ${others[1]} = ${others[0] * others[1]}，x = ${others[0] * others[1]} ÷ ${others[2]} = ${t[i]}` };
      }
      const ok = Math.random() < 0.5, d = ok ? b * k : b * k + rand(1, 3);
      return { ask: `${a} : ${b} 和 ${a * k} : ${d} 能组成比例吗？`, ans: ok ? "yes" : "no", choices: [{ v: "yes", t: "能" }, { v: "no", t: "不能" }],
        tip: "看两个比的比值是不是相等，或者外项积是不是等于内项积",
        why: `${a} × ${d} = ${a * d}，${b} × ${a * k} = ${b * a * k}，${ok ? "相等，能" : "不相等，不能"}组成比例` };
    });
  </script>
</body>
</html>
