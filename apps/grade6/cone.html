<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆锥</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand, num } = G1;
    const cone = (rl, hl) => `<svg viewBox="0 0 190 170" width="190" height="170">
      <path d="M80 15 L20 140 A60 18 0 0 0 140 140 Z" fill="rgba(255,209,102,0.2)" stroke="#ffd166" stroke-width="2.5"/>
      <path d="M20 140 A60 18 0 0 1 140 140" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="80" y1="15" x2="80" y2="140" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="80" y1="140" x2="140" y2="140" stroke="#06d6a0" stroke-width="2"/>
      <text x="110" y="158" text-anchor="middle" fill="#06d6a0" font-size="13">${rl}</text><text x="86" y="85" fill="#ddd" font-size="13">${hl}</text></svg>`;
    G1.quiz({ title: "圆锥", hint: "圆锥的体积是和它等底等高的圆柱体积的 1/3：V = 1/3 × 底面积 × 高" }, () => {
      const r = Math.random();
      if (r < 0.5) {
        const R = rand(1, 6), h = rand(1, 4) * 3, v = 3.14 * R * R * h / 3;
        return { ask: "这个圆锥的体积是多少立方厘米？（单位：厘米，π 取 3.14）", pic: cone(`r=${R}`, `h=${h}`), ans: num(v), unit: "立方厘米",
          tip: "别忘了乘 1/3", why: `1/3 × 3.14 × ${R} × ${R} × ${h} = ${num(v)}（立方厘米）` };
      }
      if (r < 0.75) {
        const V = rand(2, 30) * 3;
        return Math.random() < 0.5
          ? { ask: `一个圆柱的体积是 ${V} 立方厘米，和它等底等高的圆锥体积是多少？`, ans: String(V / 3), unit: "立方厘米", tip: "等底等高：圆锥是圆柱的 1/3", why: `${V} ÷ 3 = ${V / 3}（立方厘米）` }
          : { ask: `一个圆锥的体积是 ${V} 立方厘米，和它等底等高的圆柱体积是多少？`, ans: String(V * 3), unit: "立方厘米", tip: "等底等高：圆柱是圆锥的 3 倍", why: `${V} × 3 = ${V * 3}（立方厘米）` };
      }
      return { ask: "把一个圆锥形容器装满水倒进和它等底等高的圆柱形容器，倒几次正好装满？", ans: "3",
        choices: ["1", "2", "3", "4"].map(v => ({ v, t: `${v} 次` })), tip: "想想圆锥体积和圆柱体积的关系", why: "圆锥体积是等底等高圆柱的 1/3，倒 3 次正好装满" };
    });
  </script>
</body>
</html>
