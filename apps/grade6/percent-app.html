<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分数应用</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand, pick, num } = G1;
    const ZHE = { 9: "九", 8: "八", 7: "七", 6: "六", 5: "五", 85: "八五", 75: "七五" };
    G1.quiz({ title: "百分数应用", hint: "几折就是百分之几十；增加了百分之几 = 增加的部分 ÷ 原来的数" }, () => {
      const r = Math.random();
      if (r < 0.25) {
        const z = pick([9, 8, 7, 6, 5, 85, 75]), p = z < 10 ? z * 10 : z, P = rand(2, 40) * 20;
        return { ask: `一件衣服原价 ${P} 元，打${ZHE[z]}折出售，现价多少元？`, ans: num(P * p / 100), unit: "元",
          tip: `${ZHE[z]}折就是原价的 ${p}%`, why: `${P} × ${p}% = ${num(P * p / 100)}（元）` };
      }
      if (r < 0.45) {
        const a = pick([20, 40, 50, 80, 100, 200, 400]), p = pick([5, 10, 20, 25, 50]), b = a * (100 + p) / 100;        return { ask: `去年种树 ${a} 棵，今年种了 ${b} 棵，今年比去年增加了百分之几？`, ans: String(p), unit: "%",
          tip: "去年是单位「1」：增加的棵数 ÷ 去年的棵数", why: `(${b} − ${a}) ÷ ${a} = ${b - a} ÷ ${a} = ${p}%` };
      }
      if (r < 0.65) {
        const T = pick([20, 25, 40, 50, 100, 200]), p = pick([80, 85, 90, 95, 96, 98, 100].filter(x => T * x % 100 === 0)), g = T * p / 100;
        return { ask: `做了 ${T} 个零件，合格的有 ${g} 个，合格率是多少？`, ans: String(p), unit: "%",
          tip: "合格率 = 合格数 ÷ 总数 × 100%", why: `${g} ÷ ${T} × 100% = ${p}%` };
      }
      if (r < 0.85) {
        const P = rand(1, 10) * 1000, rate = pick([1.5, 2, 2.25, 2.5, 2.75, 3]), n = rand(1, 3);
        return { ask: `把 ${P} 元存入银行，年利率是 ${rate}%，存 ${n} 年，到期利息是多少元？`, ans: num(P * rate / 100 * n), unit: "元",
          tip: "利息 = 本金 × 利率 × 存期", why: `${P} × ${rate}% × ${n} = ${num(P * rate / 100 * n)}（元）` };
      }
      const z = pick([9, 8, 7, 6, 5]), P = rand(2, 40) * 10, x = P * z / 10;
      return { ask: `一本书打${ZHE[z]}折后卖 ${num(x)} 元，原价是多少元？`, ans: String(P), unit: "元",
        tip: "原价是单位「1」，不知道，用除法", why: `${num(x)} ÷ ${z * 10}% = ${P}（元）` };
    });
  </script>
</body>
</html>
