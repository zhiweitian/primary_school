<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四则运算顺序</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand, pick } = G1;
    const T = [
      () => { const a = rand(10, 99), b = rand(2, 9), c = rand(2, 9); return [`${a} + ${b} × ${c}`, a + b * c, `${b} × ${c} = ${b * c}`]; },
      () => { const a = rand(2, 30), b = rand(2, 30), c = rand(2, 9); return [`(${a} + ${b}) × ${c}`, (a + b) * c, `${a} + ${b} = ${a + b}`]; },
      () => { const b = rand(2, 9), c = rand(2, 9), a = b * c + rand(1, 60); return [`${a} − ${b} × ${c}`, a - b * c, `${b} × ${c} = ${b * c}`]; },
      () => { const c = rand(2, 9), k = rand(2, 12), b = rand(1, 50); return [`${b} + ${c * k} ÷ ${c}`, b + k, `${c * k} ÷ ${c} = ${k}`]; },
      () => { const c = rand(2, 9), k = rand(2, 9), b = rand(1, 40); return [`(${b + c * k} − ${b}) ÷ ${c}`, k, `${b + c * k} − ${b} = ${c * k}`]; },
      () => { const a = rand(2, 9), b = rand(5, 40), c = rand(1, b - 1); return [`${a} × (${b} − ${c})`, a * (b - c), `${b} − ${c} = ${b - c}`]; },
      () => { const b = rand(2, 9), c = rand(2, 9), d = rand(1, 20), a = rand(d, 60); return [`${a} + ${b} × ${c} − ${d}`, a + b * c - d, `${b} × ${c} = ${b * c}`]; },
      () => { const b = rand(10, 40), c = rand(5, 30), a = b + c + rand(1, 60); return [`${a} − (${b} + ${c})`, a - b - c, `${b} + ${c} = ${b + c}`]; },
      () => { const c = rand(2, 6), k = rand(2, 9), a = rand(1, c * k - 1), d = rand(2, 9); return [`(${a} + ${c * k - a}) ÷ ${c} × ${d}`, k * d, `${a} + ${c * k - a} = ${c * k}`]; }
    ];
    G1.quiz({ title: "四则运算顺序", hint: "有括号先算括号里的；没有括号先算乘除，再算加减；同一级从左往右" }, () => {
      const [e, v, first] = pick(T)();
      return { ask: `<span style="font-family:'Courier New',monospace;font-size:1.5rem;color:#a8dadc">${e} = ?</span>`,
        ans: String(v), tip: `第一步先算：${first.split(" = ")[0]}`, why: `先算 ${first}，最后得 ${v}` };
    });
  </script>
</body>
</html>
