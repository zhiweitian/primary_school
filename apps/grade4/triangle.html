<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角形</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand, pick, shuffle } = G1;
    const BY_ANGLE = { acute: "锐角三角形", right: "直角三角形", obtuse: "钝角三角形" };
    const BY_SIDE = { equi: "等边三角形", iso: "等腰三角形", plain: "一般三角形" };
    G1.quiz({ title: "三角形", hint: "三角形内角和是 180°；任意两边之和大于第三边" }, () => {
      const r = Math.random();
      if (r < 0.3) {
        const a = rand(20, 100), b = rand(15, 160 - a - 5);
        return { ask: `三角形的两个角是 ${a}° 和 ${b}°，第三个角是多少度？`, ans: String(180 - a - b), unit: "°",
          tip: "三个角加起来是 180°", why: `180 − ${a} − ${b} = ${180 - a - b}（°）` };
      }
      if (r < 0.55) {
        const k = pick(Object.keys(BY_ANGLE));
        const big = { acute: rand(61, 89), right: 90, obtuse: rand(95, 150) }[k];
        const a = rand(Math.max(5, 180 - big - big + 1), Math.min(big - 1, 180 - big - 5)), angs = shuffle([big, a, 180 - big - a]);
        return { ask: `一个三角形的三个角是 ${angs.join("°、")}°，它是什么三角形？`, ans: k, key: angs.join(),
          choices: Object.keys(BY_ANGLE).map(v => ({ v, t: BY_ANGLE[v] })), tip: "看最大的那个角：小于 90° 锐角，等于 90° 直角，大于 90° 钝角",
          why: `最大的角是 ${big}°，所以是${BY_ANGLE[k]}` };
      }
      if (r < 0.75) {
        const k = pick(Object.keys(BY_SIDE));
        const a = rand(3, 12);
        let s;
        if (k === "equi") s = [a, a, a];
        else if (k === "iso") { let b; do b = rand(2, 2 * a - 1); while (b === a); s = [a, a, b]; }
        else { let b, c; do { b = rand(3, 12); c = rand(3, 12); } while (b === a || c === a || b === c || a + b <= c || a + c <= b || b + c <= a); s = [a, b, c]; }
        s = shuffle(s);
        return { ask: `三条边长 ${s.join(" 厘米、")} 厘米，最准确地说它是什么三角形？`, ans: k, key: s.join(),
          choices: Object.keys(BY_SIDE).map(v => ({ v, t: BY_SIDE[v] })), tip: "三条边都相等是等边；只有两条相等是等腰",
          why: k === "equi" ? "三条边都相等，是等边三角形（它也是特殊的等腰三角形）" : k === "iso" ? "有两条边相等，是等腰三角形" : "三条边都不相等，是一般三角形" };
      }
      const a = rand(2, 10), b = rand(2, 10), c = Math.random() < 0.5 ? rand(Math.abs(a - b) + 1, a + b - 1) : a + b + rand(0, 3);
      const ok = a + b > c && a + c > b && b + c > a;
      const [x, y, z] = [a, b, c].sort((m, n) => m - n);
      return { ask: `用 ${a} 厘米、${b} 厘米、${c} 厘米的三根小棒，能围成三角形吗？`, ans: ok ? "yes" : "no",
        choices: [{ v: "yes", t: "能" }, { v: "no", t: "不能" }], tip: "看两条短边加起来，是不是比最长的边长",
        why: `${x} + ${y} = ${x + y}，${x + y > z ? "大于" : x + y === z ? "等于" : "小于"}最长边 ${z}，${ok ? "能" : "不能"}围成` };
    });
  </script>
</body>
</html>
