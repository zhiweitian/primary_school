<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>改写和近似数</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand } = G1;
    G1.quiz({ title: "改写和近似数", hint: "改写：整万的数去掉末尾 4 个 0 写「万」；求近似数：看省略部分的最高位，四舍五入" }, () => {
      const r = Math.random();
      if (r < 0.25) {
        const k = rand(2, 9999);
        return { ask: `把 ${k * 10000} 改写成用「万」作单位的数`, ans: String(k), unit: "万",
          tip: "整万的数，去掉末尾 4 个 0，再写上「万」", why: `${k * 10000} = ${k}万` };
      }
      if (r < 0.4) {
        const k = rand(2, 99);
        return { ask: `把 ${k}00000000 改写成用「亿」作单位的数`, ans: String(k), unit: "亿",
          tip: "整亿的数，去掉末尾 8 个 0，再写上「亿」", why: `${k}00000000 = ${k}亿` };
      }
      if (r < 0.75) {
        const n = rand(10001, 99940000), k = Math.round(n / 10000), d = Math.floor(n / 1000) % 10;
        return { ask: `把 ${n} 省略「万」位后面的尾数，约是多少万？`, ans: String(k), unit: "万",
          tip: "看千位：满 5 向万位进 1，不满 5 就舍去", why: `千位是 ${d}，${d >= 5 ? "满 5 进 1" : "不满 5 舍去"}，${n} ≈ ${k}万` };
      }
      const n = rand(100000001, 9940000000), k = Math.round(n / 1e8), d = Math.floor(n / 1e7) % 10;
      return { ask: `把 ${n} 省略「亿」位后面的尾数，约是多少亿？`, ans: String(k), unit: "亿",
        tip: "看千万位：满 5 向亿位进 1，不满 5 就舍去", why: `千万位是 ${d}，${d >= 5 ? "满 5 进 1" : "不满 5 舍去"}，${n} ≈ ${k}亿` };
    });
  </script>
</body>
</html>
