<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周长</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <div class="container">
    <h1>周长</h1>
    <p class="hint">周长是沿着图形边线走一圈的长度</p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card" id="card"></div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const S = 30;
    let q;

    function poly(n) {
      const cells = [[0, 0]], set = new Set(["0,0"]);
      while (cells.length < n) {
        const [x, y] = G1.pick(cells), [dx, dy] = G1.pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
        const k = `${x + dx},${y + dy}`;
        if (!set.has(k)) { set.add(k); cells.push([x + dx, y + dy]); }
      }
      const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
      return cells.map(([x, y]) => [x - mx, y - my]);
    }

    function edges(cells) {
      const set = new Set(cells.map(c => c.join(",")));
      return cells.reduce((s, [x, y]) => s + [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => !set.has(`${x + dx},${y + dy}`)).length, 0);
    }

    function grid(cells) {
      const w = Math.max(...cells.map(c => c[0])) + 3, h = Math.max(...cells.map(c => c[1])) + 3;
      let s = `<svg viewBox="0 0 ${w * S} ${h * S}" width="${w * S}" height="${h * S}">`;
      for (let i = 0; i <= w; i++) s += `<line x1="${i * S}" y1="0" x2="${i * S}" y2="${h * S}" stroke="rgba(255,255,255,0.15)"/>`;
      for (let j = 0; j <= h; j++) s += `<line x1="0" y1="${j * S}" x2="${w * S}" y2="${j * S}" stroke="rgba(255,255,255,0.15)"/>`;
      const set = new Set(cells.map(c => c.join(",")));
      cells.forEach(([x, y]) => {
        const X = (x + 1) * S, Y = (y + 1) * S;
        s += `<rect x="${X}" y="${Y}" width="${S}" height="${S}" fill="rgba(255,209,102,0.25)"/>`;
        if (!set.has(`${x},${y - 1}`)) s += `<line x1="${X}" y1="${Y}" x2="${X + S}" y2="${Y}" stroke="#ffd166" stroke-width="3"/>`;
        if (!set.has(`${x},${y + 1}`)) s += `<line x1="${X}" y1="${Y + S}" x2="${X + S}" y2="${Y + S}" stroke="#ffd166" stroke-width="3"/>`;
        if (!set.has(`${x - 1},${y}`)) s += `<line x1="${X}" y1="${Y}" x2="${X}" y2="${Y + S}" stroke="#ffd166" stroke-width="3"/>`;
        if (!set.has(`${x + 1},${y}`)) s += `<line x1="${X + S}" y1="${Y}" x2="${X + S}" y2="${Y + S}" stroke="#ffd166" stroke-width="3"/>`;
      });
      return s + "</svg>";
    }

    function rectPic(a, b) {
      const k = Math.min(200 / a, 110 / b, 22), W = a * k, H = b * k;
      return `<svg viewBox="0 0 ${W + 90} ${H + 44}" width="${W + 90}" height="${H + 44}">
        <rect x="10" y="10" width="${W}" height="${H}" fill="rgba(255,209,102,0.2)" stroke="#ffd166" stroke-width="3"/>
        <text x="${10 + W / 2}" y="${H + 34}" text-anchor="middle" fill="#ddd" font-size="15">${a} 厘米</text>
        ${a === b ? "" : `<text x="${W + 16}" y="${10 + H / 2 + 5}" fill="#ddd" font-size="15">${b} 厘米</text>`}
      </svg>`;
    }

    function make() {
      const kind = G1.pick(["grid", "grid", "rect", "square", "back"]);
      if (kind === "grid") {
        const cells = poly(G1.rand(3, 6)), p = edges(cells);
        return { kind, cells, ans: String(p), key: cells.join(";"),
          why: `沿着边线数一圈，一共 ${p} 条小边，周长是 ${p} 厘米` };
      }
      if (kind === "square") {
        const a = G1.rand(2, 15);
        return { kind, a, b: a, ans: String(4 * a), key: "sq" + a, why: `正方形 4 条边一样长：${a} × 4 = ${4 * a}（厘米）` };
      }
      const a = G1.rand(4, 15), b = G1.rand(2, a - 1);
      if (kind === "rect") return { kind, a, b, ans: String(2 * (a + b)), key: `r${a}x${b}`, why: `长 + 宽 + 长 + 宽：(${a} + ${b}) × 2 = ${2 * (a + b)}（厘米）` };
      return { kind, a, b, ans: String(b), key: `b${a}x${b}`, why: `${2 * (a + b)} ÷ 2 = ${a + b} 是一条长加一条宽，${a + b} − ${a} = ${b}（厘米）` };
    }

    function render() {
      G1.resetShell();
      q = G1.fresh(make);
      const hint = G1.needHint();
      let ask, pic, tip;
      if (q.kind === "grid") {
        ask = "每个小方格边长 1 厘米，黄色图形的周长是多少？";
        pic = grid(q.cells);
        tip = "从一个角出发，沿着黄线走一圈，每走一小格记 1";
      } else if (q.kind === "back") {
        ask = `长方形的周长是 ${2 * (q.a + q.b)} 厘米，长是 ${q.a} 厘米，宽是多少？`;
        pic = "";
        tip = "周长的一半是一条长加一条宽";
      } else {
        ask = q.kind === "square" ? "这个正方形的周长是多少？" : "这个长方形的周长是多少？";
        pic = rectPic(q.a, q.b);
        tip = q.kind === "square" ? "正方形 4 条边都一样长" : "长方形对边一样长：两条长、两条宽";
      }
      G1.$("card").innerHTML = `
        <div class="ask">${ask}</div>
        ${pic ? `<div class="pic">${pic}</div>` : ""}
        ${hint ? `<div class="tip">${tip}</div>` : ""}
        <div class="fill">${G1.box()}<span class="u">厘米</span></div>
        ${G1.okBtn()}`;
      G1.bindOk(([v]) => G1.finish(+v === +q.ans, q.why, render));
    }

    G1.boot(render);
  </script>
</body>
</html>
