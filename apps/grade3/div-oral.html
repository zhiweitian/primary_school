<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>口算除法</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <div class="container">
    <h1>口算除法</h1>
    <p class="hint">120 ÷ 3 想成 12 个十除以 3，得 4 个十，就是 40</p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card" id="card"></div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const UNIT = { 10: "十", 100: "百" };
    let q;

    function make() {
      if (Math.random() < 0.35) {
        const b = G1.rand(2, 4);
        const t = G1.rand(1, Math.floor(9 / b)), o = G1.rand(1, Math.floor(9 / b));
        const a = t * b * 10 + o * b;
        return { a, b, ans: String(t * 10 + o), how: `${t * b * 10} ÷ ${b} = ${t * 10}，${o * b} ÷ ${b} = ${o}，合起来 ${t * 10 + o}` };
      }
      const b = G1.rand(2, 9), k = G1.rand(1, 9), u = G1.pick([10, 10, 100]);
      const a = k * b * u;
      return { a, b, ans: String(k * u), how: `想 ${k * b} ÷ ${b} = ${k}，${k * b} 个${UNIT[u]}除以 ${b} 是 ${k} 个${UNIT[u]}，就是 ${k * u}` };
    }

    function render() {
      G1.resetShell();
      q = G1.fresh(() => { const x = make(); x.key = x.a + "/" + x.b; return x; });
      const hint = G1.needHint();
      G1.$("card").innerHTML = `
        <div class="fill">
          <span class="part"><span class="t">${q.a}</span><small>被除数</small></span>
          <span class="op">÷</span>
          <span class="part"><span class="t">${q.b}</span><small>除数</small></span>
          <span class="op">=</span>
          <span class="part">${G1.box("l")}<small>商</small></span>
        </div>
        ${hint ? `<div class="tip" style="margin-top:0.7rem">${q.how.replace(/，合起来.*|，就是.*/, "，……")}</div>` : ""}
        ${G1.okBtn()}`;
      G1.bindOk(([v]) => G1.finish(+v === +q.ans, q.how, render));
    }

    G1.boot(render);
  </script>
</body>
</html>
