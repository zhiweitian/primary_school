<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年月日和24时计时</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <div class="container">
    <h1>年月日和24时计时</h1>
    <p class="hint">一天 24 小时；下午和晚上的时刻加 12 就是 24 时计时法</p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card" id="card"></div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const leap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
    const hm = (h, m) => `${h}:${String(m).padStart(2, "0")}`;
    const period = h => (h < 12 ? "上午" : h === 12 ? "中午" : h < 19 ? "下午" : "晚上");
    let q;

    function make() {
      const kind = G1.pick(["to24", "to24", "from24", "span", "span", "month", "feb"]);
      if (kind === "to24") {
        const h = G1.rand(8, 23);
        const h12 = h > 12 ? h - 12 : h;
        return { kind, ask: `${period(h)} ${h12} 时，用 24 时计时法是几时？`, ans: String(h), unit: "时",
          tip: "下午、晚上的时刻要加 12", why: h > 12 ? `${period(h)} ${h12} 时：${h12} + 12 = ${h}，是 ${h} 时` : `${period(h)}的时刻不用变，就是 ${h} 时` };
      }
      if (kind === "from24") {
        const h = G1.rand(13, 23);
        return { kind, ask: `${h} 时是${period(h)}几时？`, ans: String(h - 12), unit: "时",
          tip: "超过 12 的时刻减去 12", why: `${h} − 12 = ${h - 12}，是${period(h)} ${h - 12} 时` };
      }
      if (kind === "span") {
        const h1 = G1.rand(7, 16), m1 = G1.rand(0, 11) * 5;
        const len = G1.rand(1, 5) * 60 + G1.pick([0, 15, 30, 45, G1.rand(1, 11) * 5]);
        const end = h1 * 60 + m1 + len;
        const h2 = Math.floor(end / 60), m2 = end % 60;
        const H = Math.floor(len / 60), M = len % 60;
        return { kind, ask: `从 ${hm(h1, m1)} 到 ${hm(h2, m2)}，经过了多长时间？`, ans: [String(H), String(M)], two: true,
          tip: "先数整时，再数零头的分钟", why: `${hm(h1, m1)} 到 ${hm(h1 + H, m1)} 是 ${H} 小时，再到 ${hm(h2, m2)} 是 ${M} 分，共 ${H} 小时 ${M} 分` };
      }
      if (kind === "month") {
        let mo = G1.rand(1, 12);
        if (mo === 2) mo = 4;
        const big = DAYS[mo - 1] === 31;
        return { kind, ask: `${mo} 月有几天？`, ans: String(DAYS[mo - 1]), unit: "天",
          tip: "大月：1、3、5、7、8、10、12 月；其余是小月（2 月除外）", why: `${mo} 月是${big ? "大月，有 31 天" : "小月，有 30 天"}` };
      }
      const y = Math.random() < 0.25 ? G1.pick([1900, 2000, 2100, 1800, 2400]) : G1.rand(1990, 2040);
      const L = leap(y);
      const why = y % 100 === 0
        ? `${y} 是整百年，要看能不能被 400 整除：${y % 400 === 0 ? "能，是闰年，2 月 29 天" : "不能，是平年，2 月 28 天"}`
        : `${y} ${y % 4 === 0 ? "能" : "不能"}被 4 整除，是${L ? "闰年，2 月 29 天" : "平年，2 月 28 天"}`;
      return { kind, ask: `${y} 年 2 月有几天？`, ans: String(L ? 29 : 28), unit: "天",
        tip: "一般年份是 4 的倍数是闰年；整百年要是 400 的倍数才是闰年", why };
    }

    function render() {
      G1.resetShell();
      q = G1.fresh(() => { const x = make(); x.key = x.ask; return x; });
      const hint = G1.needHint();
      G1.$("card").innerHTML = `
        <div class="ask">${q.ask}</div>
        ${hint ? `<div class="tip">${q.tip}</div>` : ""}
        <div class="fill">${q.two
          ? `${G1.box("s")}<span class="u">小时</span>${G1.box("s")}<span class="u">分</span>`
          : `${G1.box("s")}<span class="u">${q.unit}</span>`}</div>
        ${G1.okBtn()}`;
      G1.bindOk(v => {
        const ok = q.two ? +v[0] === +q.ans[0] && +v[1] === +q.ans[1] : +v[0] === +q.ans;
        G1.finish(ok, q.why, render);
      });
    }

    G1.boot(render);
  </script>
</body>
</html>
