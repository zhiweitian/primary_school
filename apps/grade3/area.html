<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面积</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <div class="container">
    <h1>面积</h1>
    <p class="hint">面积是面的大小：里面能铺几个 1 平方厘米的小方格</p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card" id="card"></div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const S = 28;
    const WHICH = [
      ["给相框四周镶一圈金边，金边多长", "per"], ["绕操场跑一圈，跑了多远", "per"], ["给菜地围一圈篱笆，篱笆多长", "per"],
      ["给教室地面铺地砖，铺多大", "area"], ["给桌面铺一块桌布，桌布多大", "area"], ["给黑板刷油漆，刷多大", "area"]
    ];
    let q;

    function poly(n) {
      const cells = [[0, 0]], set = new Set(["0,0"]);
      while (cells.length < n) {
        const [x, y] = G1.pick(cells), [dx, dy] = G1.pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
        const k = `${x + dx},${y + dy}`;
        if (!set.has(k)) { set.add(k); cells.push([x + dx, y + dy]); }
      }
      const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
      return cells.map(([x, y]) => [x - mx, y - my]);
    }

    function rectCells(a, b) {
      const cells = [];
      for (let x = 0; x < a; x++) for (let y = 0; y < b; y++) cells.push([x, y]);
      return cells;
    }

    function grid(cells) {
      const w = Math.max(...cells.map(c => c[0])) + 3, h = Math.max(...cells.map(c => c[1])) + 3;
      let s = `<svg viewBox="0 0 ${w * S} ${h * S}" width="${w * S}" height="${h * S}">`;
      cells.forEach(([x, y]) => {
        s += `<rect x="${(x + 1) * S}" y="${(y + 1) * S}" width="${S}" height="${S}" fill="rgba(255,209,102,0.55)"/>`;
      });
      for (let i = 0; i <= w; i++) s += `<line x1="${i * S}" y1="0" x2="${i * S}" y2="${h * S}" stroke="rgba(255,255,255,0.2)"/>`;
      for (let j = 0; j <= h; j++) s += `<line x1="0" y1="${j * S}" x2="${w * S}" y2="${j * S}" stroke="rgba(255,255,255,0.2)"/>`;
      return s + "</svg>";
    }

    function rectPic(a, b) {
      const k = Math.min(200 / a, 110 / b, 22), W = a * k, H = b * k;
      return `<svg viewBox="0 0 ${W + 90} ${H + 44}" width="${W + 90}" height="${H + 44}">
        <rect x="10" y="10" width="${W}" height="${H}" fill="rgba(255,209,102,0.2)" stroke="#ffd166" stroke-width="3"/>
        <text x="${10 + W / 2}" y="${H + 34}" text-anchor="middle" fill="#ddd" font-size="15">${a} 厘米</text>
        ${a === b ? "" : `<text x="${W + 16}" y="${10 + H / 2 + 5}" fill="#ddd" font-size="15">${b} 厘米</text>`}
      </svg>`;
    }

    function make() {
      const kind = G1.pick(["grid", "grid", "rect", "square", "which"]);
      if (kind === "grid") {
        const isRect = Math.random() < 0.4;
        const a = G1.rand(2, 6), b = G1.rand(2, 4);
        const cells = isRect ? rectCells(a, b) : poly(G1.rand(4, 9));
        return { kind, cells, ans: String(cells.length), key: cells.join(";"),
          why: isRect ? `每行 ${a} 个，有 ${b} 行：${a} × ${b} = ${a * b}，面积是 ${a * b} 平方厘米` : `数一数，一共 ${cells.length} 个小方格，面积是 ${cells.length} 平方厘米` };
      }
      if (kind === "which") {
        const [t, ans] = G1.pick(WHICH);
        return { kind, t, ans, key: t, why: ans === "per" ? `${t.split("，")[0]}，是沿着边走一圈，求的是周长` : `${t.split("，")[0]}，是铺满整个面，求的是面积` };
      }
      if (kind === "square") {
        const a = G1.rand(2, 12);
        return { kind, a, b: a, ans: String(a * a), key: "sq" + a, why: `正方形面积 = 边长 × 边长：${a} × ${a} = ${a * a}（平方厘米）` };
      }
      const a = G1.rand(3, 12), b = G1.rand(2, a - 1);
      return { kind, a, b, ans: String(a * b), key: `r${a}x${b}`, why: `长方形面积 = 长 × 宽：${a} × ${b} = ${a * b}（平方厘米）` };
    }

    function render() {
      G1.resetShell();
      q = G1.fresh(make);
      const hint = G1.needHint();
      const card = G1.$("card");
      if (q.kind === "which") {
        card.innerHTML = `
          <div class="ask">${q.t}？求的是周长还是面积？</div>
          ${hint ? `<div class="tip">绕一圈的是周长；铺满一个面的是面积</div>` : ""}
          ${G1.choices([{ v: "per", t: "周长" }, { v: "area", t: "面积" }])}`;
        G1.bindChoices(v => G1.finish(v === q.ans, q.why, render));
        return;
      }
      const ask = q.kind === "grid" ? "每个小方格是 1 平方厘米，黄色部分的面积是多少？"
        : q.kind === "square" ? "这个正方形的面积是多少？" : "这个长方形的面积是多少？";
      const tip = q.kind === "grid" ? "一格一格数；排得整整齐齐的，可以一行几个 × 几行"
        : "长是几厘米，一行就能摆几个 1 平方厘米；宽是几厘米，就能摆几行";
      card.innerHTML = `
        <div class="ask">${ask}</div>
        <div class="pic">${q.kind === "grid" ? grid(q.cells) : rectPic(q.a, q.b)}</div>
        ${hint ? `<div class="tip">${tip}</div>` : ""}
        <div class="fill">${G1.box()}<span class="u">平方厘米</span></div>
        ${G1.okBtn()}`;
      G1.bindOk(([v]) => G1.finish(+v === +q.ans, q.why, render));
    }

    G1.boot(render);
  </script>
</body>
</html>
