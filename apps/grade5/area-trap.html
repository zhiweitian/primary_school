<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梯形面积</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand } = G1;
    const r1 = v => Math.round(v * 10) / 10;
    function pic(a, b, h, s, l) {
      const k = Math.min(220 / b, 110 / h, 20), X = 30, Y = 22, B = r1(Y + h * k);
      const P = [[X + l * k, Y], [X + (l + a) * k, Y], [X + b * k, Y + h * k], [X, Y + h * k]].map(p => p.map(r1).join(","));
      const hx = r1(X + l * k), W = r1(X + b * k + 40), H = r1(B + 28);
      return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <polygon points="${P.join(" ")}" fill="rgba(255,209,102,0.2)" stroke="#ffd166" stroke-width="3"/>
        <line x1="${hx}" y1="${Y}" x2="${hx}" y2="${B}" stroke="#06d6a0" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="${hx + 5}" y="${r1(Y + h * k / 2 + 5)}" fill="#06d6a0" font-size="13">高 ${h}</text>
        <text x="${r1(X + (l + a / 2) * k)}" y="${Y - 7}" text-anchor="middle" fill="#ddd" font-size="13">上底 ${a}</text>
        <text x="${r1(X + b * k / 2)}" y="${H - 6}" text-anchor="middle" fill="#ddd" font-size="13">下底 ${b} 厘米</text>
        <text x="${r1(X + l * k / 2 - 24)}" y="${r1(Y + h * k / 2)}" fill="#aaa" font-size="13">${s}</text></svg>`;
    }
    G1.quiz({ title: "梯形面积", hint: "两个完全一样的梯形能拼成平行四边形：梯形面积 =（上底 + 下底）× 高 ÷ 2" }, () => {
      let a, b, h;
      do { a = rand(2, 10); b = a + rand(3, 8); h = rand(3, 10); } while ((a + b) * h % 2);
      const S = (a + b) * h / 2;
      if (Math.random() < 0.7) return { ask: "这个梯形的面积是多少？", pic: pic(a, b, h, h + rand(1, 3), rand(1, b - a - 1)), ans: String(S), unit: "平方厘米",
        tip: "先把上底和下底加起来，再乘高，最后除以 2；斜边不用", why: `(${a} + ${b}) × ${h} ÷ 2 = ${S}（平方厘米）` };
      return { ask: `梯形的面积是 ${S} 平方厘米，上底 ${a} 厘米，下底 ${b} 厘米，高是多少厘米？`, ans: String(h), unit: "厘米",
        tip: "面积 × 2 ÷（上底 + 下底）", why: `${S} × 2 ÷ (${a} + ${b}) = ${h}（厘米）` };
    });
  </script>
</body>
</html>
