<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平行四边形面积</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand } = G1;
    const r1 = v => Math.round(v * 10) / 10;
    function pic(b, h, s, off) {
      const k = Math.min(200 / (b + off), 110 / h, 20), X = 30, Y = 10;
      const P = [[X + off * k, Y], [X + (off + b) * k, Y], [X + b * k, Y + h * k], [X, Y + h * k]].map(p => p.map(r1).join(","));
      const hx = r1(X + off * k), W = r1(X + (off + b) * k + 60), H = r1(Y + h * k + 30);
      return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <polygon points="${P.join(" ")}" fill="rgba(255,209,102,0.2)" stroke="#ffd166" stroke-width="3"/>
        <line x1="${hx}" y1="${Y}" x2="${hx}" y2="${r1(Y + h * k)}" stroke="#06d6a0" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="${hx + 5}" y="${r1(Y + h * k / 2 + 5)}" fill="#06d6a0" font-size="13">高 ${h}</text>
        <text x="${r1(X + b * k / 2)}" y="${H - 6}" text-anchor="middle" fill="#ddd" font-size="13">底 ${b} 厘米</text>
        <text x="${r1(X + off * k / 2 - 26)}" y="${r1(Y + h * k / 2)}" fill="#aaa" font-size="13">${s}</text></svg>`;
    }
    G1.quiz({ title: "平行四边形面积", hint: "沿着高剪下一块，平移过去，就拼成一个长方形：面积 = 底 × 高" }, () => {
      const b = rand(4, 15), h = rand(3, 10), s = h + rand(1, 3), r = Math.random();
      const tip = "斜着的那条边不是高！高是从顶点到底边的垂直线段";
      if (r < 0.6) return { ask: "这个平行四边形的面积是多少？", pic: pic(b, h, s, rand(2, 4)), ans: String(b * h), unit: "平方厘米",
        tip, why: `面积 = 底 × 高 = ${b} × ${h} = ${b * h}（平方厘米），斜边 ${s} 用不上` };
      if (r < 0.8) return { ask: `平行四边形的面积是 ${b * h} 平方厘米，底是 ${b} 厘米，高是多少厘米？`, ans: String(h), unit: "厘米",
        tip: "高 = 面积 ÷ 底", why: `${b * h} ÷ ${b} = ${h}（厘米）` };
      return { ask: `平行四边形的面积是 ${b * h} 平方厘米，高是 ${h} 厘米，底是多少厘米？`, ans: String(b), unit: "厘米",
        tip: "底 = 面积 ÷ 高", why: `${b * h} ÷ ${h} = ${b}（厘米）` };
    });
  </script>
</body>
</html>
