<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长方体的体积</title>
  <link rel="stylesheet" href="../grade1/g1.css">
</head>
<body>
  <script src="../../practice-stats-config.js"></script>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="../grade1/g1.js"></script>
  <script>
    const { rand, pick, num } = G1;
    const r1 = v => Math.round(v * 10) / 10;

    function cuboid(l, w, h, grid, labels) {
      const k = Math.min(160 / (l + w * 0.5), 110 / (h + w * 0.5), 30), dx = w * k * 0.5, dy = -w * k * 0.5;
      const X = 20, Y = r1(10 - dy), L = l * k, Hh = h * k;
      const poly = (pts, fill) => `<polygon points="${pts.map(p => p.map(r1).join(",")).join(" ")}" fill="${fill}" stroke="#ffd166" stroke-width="2"/>`;
      let s = poly([[X, Y], [X + dx, Y + dy], [X + L + dx, Y + dy], [X + L, Y]], "rgba(255,209,102,0.35)")
        + poly([[X + L, Y], [X + L + dx, Y + dy], [X + L + dx, Y + dy + Hh], [X + L, Y + Hh]], "rgba(255,209,102,0.15)")
        + poly([[X, Y], [X + L, Y], [X + L, Y + Hh], [X, Y + Hh]], "rgba(255,209,102,0.25)");
      const ln = (x1, y1, x2, y2) => `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="rgba(255,209,102,0.6)" stroke-width="1"/>`;
      if (grid) {
        for (let i = 1; i < l; i++) s += ln(X + i * k, Y, X + i * k, Y + Hh) + ln(X + i * k, Y, X + i * k + dx, Y + dy);
        for (let j = 1; j < h; j++) s += ln(X, Y + j * k, X + L, Y + j * k) + ln(X + L, Y + j * k, X + L + dx, Y + j * k + dy);
        for (let t = 1; t < w; t++) {
          const ox = dx * t / w, oy = dy * t / w;
          s += ln(X + ox, Y + oy, X + L + ox, Y + oy) + ln(X + L + ox, Y + oy, X + L + ox, Y + Hh + oy);
        }
      }
      const W = r1(X + L + dx + 70), H = r1(Y + Hh + 26);
      if (labels) s += `<text x="${r1(X + L / 2)}" y="${H - 6}" text-anchor="middle" fill="#ddd" font-size="13">${labels[0]}</text>
        <text x="${r1(X + L + dx + 6)}" y="${r1(Y + dy + Hh / 2 + 5)}" fill="#ddd" font-size="13">${labels[2]}</text>
        <text x="${r1(X + L + dx / 2 + 6)}" y="${r1(Y + dy / 2 + 2)}" fill="#ddd" font-size="13">${labels[1]}</text>`;
      return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
    }

    G1.quiz({ title: "长方体的体积", hint: "体积是物体所占空间的大小：长方体体积 = 长 × 宽 × 高，正方体体积 = 棱长 × 棱长 × 棱长" }, () => {
      const r = Math.random();
      if (r < 0.25) {
        const l = rand(2, 4), w = rand(1, 3), h = rand(1, 3);
        return { ask: "每个小正方体是 1 立方厘米，这个长方体的体积是多少？", pic: cuboid(l, w, h, true), ans: String(l * w * h), unit: "立方厘米",
          tip: "先数一层有几个（长 × 宽），再看有几层（高）", why: `一层 ${l} × ${w} = ${l * w} 个，${h} 层：${l * w} × ${h} = ${l * w * h}（立方厘米）` };
      }
      if (r < 0.5) {
        const l = rand(3, 12), w = rand(2, 8), h = rand(2, 10);
        return { ask: "这个长方体的体积是多少？", pic: cuboid(l, w, h, false, [`长 ${l} 厘米`, `宽 ${w}`, `高 ${h}`]), ans: String(l * w * h), unit: "立方厘米",
          tip: "长 × 宽 × 高", why: `${l} × ${w} × ${h} = ${l * w * h}（立方厘米）` };
      }
      if (r < 0.65) {
        const a = rand(2, 10);
        return { ask: "这个正方体的体积是多少？", pic: cuboid(a, a, a, false, [`棱长 ${a} 厘米`, "", ""]), ans: String(a ** 3), unit: "立方厘米",
          tip: "棱长 × 棱长 × 棱长", why: `${a} × ${a} × ${a} = ${a ** 3}（立方厘米）` };
      }
      if (r < 0.8) {
        const l = rand(3, 12), w = rand(2, 8), h = rand(2, 10);
        return { ask: `长方体的体积是 ${l * w * h} 立方厘米，长 ${l} 厘米，宽 ${w} 厘米，高是多少厘米？`, ans: String(h), unit: "厘米",
          tip: "高 = 体积 ÷（长 × 宽）", why: `${l * w * h} ÷ (${l} × ${w}) = ${h}（厘米）` };
      }
      const x = num(rand(1, 99) / pick([1, 10])), [from, to, m] = pick([["立方分米", "立方厘米", 1000], ["升", "毫升", 1000], ["立方米", "立方分米", 1000], ["立方厘米", "毫升", 1], ["立方分米", "升", 1]]);
      return { ask: `${x} ${from} = ？${to}`, ans: num(+x * m), unit: to, tip: "1 立方米 = 1000 立方分米，1 立方分米 = 1000 立方厘米；1 升 = 1 立方分米，1 毫升 = 1 立方厘米",
        why: m === 1 ? `1 ${from} = 1 ${to}，所以是 ${x} ${to}` : `1 ${from} = 1000 ${to}，${x} × 1000 = ${num(+x * m)}` };
    });
  </script>
</body>
</html>
