<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平面图形</title>
  <link rel="stylesheet" href="g1.css">
  <style>
    .art { width: 88px; height: 80px; display: block; margin: 0 auto; }
    .art.lg { width: 130px; height: 118px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>平面图形</h1>
    <p class="hint">从盒子上描下来的是平平的图形：看边和角</p>
    <div class="stats">
      <div><div class="stat-label">做题数</div><div class="stat-value" id="totalDone">0</div></div>
      <div><div class="stat-label">熟练度</div><div class="stat-value prof" id="proficiency">—</div></div>
    </div>
    <div class="card" id="card"></div>
    <div class="status" id="status"></div>
    <button class="btn-next" id="nextBtn">下一题 →</button>
  </div>
  <script src="../../practice-stats-store.js"></script>
  <script src="../../play-wallet.js"></script>
  <script src="g1.js"></script>
  <script>
    const SVG = {
      圆: `<svg class="art" viewBox="0 0 80 80"><circle cx="40" cy="40" r="26" fill="none" stroke="#ffd166" stroke-width="4"/></svg>`,
      正方形: `<svg class="art" viewBox="0 0 80 80"><rect x="18" y="18" width="44" height="44" fill="none" stroke="#90dbf4" stroke-width="4"/></svg>`,
      长方形: `<svg class="art" viewBox="0 0 80 80"><rect x="10" y="24" width="60" height="32" fill="none" stroke="#58d68d" stroke-width="4"/></svg>`,
      三角形: `<svg class="art" viewBox="0 0 80 80"><path d="M40 16 L66 62 L14 62 Z" fill="none" stroke="#e07a3d" stroke-width="4"/></svg>`,
      平行四边形: `<svg class="art" viewBox="0 0 80 80"><path d="M22 22 L66 22 L58 58 L14 58 Z" fill="none" stroke="#c39bd3" stroke-width="4"/></svg>`
    };
    const SIDES = { 圆: 0, 正方形: 4, 长方形: 4, 三角形: 3, 平行四边形: 4 };
    const FROM = [
      { solid: "正方体", face: "正方形" },
      { solid: "长方体", face: "长方形" },
      { solid: "圆柱", face: "圆" }
    ];
    const NAMES = Object.keys(SVG);
    let q;
    function render() {
      G1.resetShell();
      q = G1.fresh(() => {
        const kind = G1.pick(["看", "边", "描"]);
        if (kind === "描") {
          const f = G1.pick(FROM);
          return { kind, name: f.face, from: f, key: "m" + f.solid };
        }
        const name = G1.pick(NAMES);
        return { kind, name, sides: SIDES[name], key: kind[0] + name };
      });
      if (q.kind === "看") {
        G1.$("card").innerHTML = `<div class="ask">这是什么？</div>
          <div class="big-shape">${SVG[q.name].replace('class="art"', 'class="art lg"')}</div>
          <div class="choices">${NAMES.map(n => `<button data-v="${n}">${n}</button>`).join("")}</div>`;
        G1.bindChoices(v => G1.finish(v === q.name, "是 " + q.name, render));
      } else if (q.kind === "边") {
        G1.$("card").innerHTML = `<div class="ask">它有几条边？</div>
          <div class="big-shape">${SVG[q.name].replace('class="art"', 'class="art lg"')}</div>
          <div class="choices">
            <button data-v="0">没有边</button>
            <button data-v="3">3 条</button>
            <button data-v="4">4 条</button>
          </div>`;
        G1.bindChoices(v => G1.finish(+v === q.sides, q.name + (q.sides ? " 有 " + q.sides + " 条边" : " 是弯的，没有边"), render));
      } else {
        G1.$("card").innerHTML = `<div class="ask">从「${q.from.solid}」上描下来，最像哪个？</div>
          <div class="shapes">${NAMES.filter(n => n !== "平行四边形").map(n =>
            `<button class="shape-btn" data-v="${n}">${SVG[n]}<span class="nm">${n}</span></button>`
          ).join("")}</div>`;
        G1.bindChoices(v => G1.finish(v === q.name, "描下来是 " + q.name, render));
      }
    }
    G1.boot(render);
  </script>
</body>
</html>
