<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5d4037">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小学数学">
  <title>人教版小学数学 · 先修知识树</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #faf8f5; color: #333;
    }
    .header {
      padding: 0.75rem 1.1rem; background: #fff;
      border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
    }
    h1 { font-size: 1.1rem; color: #5d4037; }
    .subtitle { font-size: 0.74rem; color: #888; margin-top: 0.2rem; }
    .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.55rem; flex-wrap: wrap; }
    .btn {
      padding: 0.32rem 0.7rem; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; font-size: 0.78rem; cursor: pointer;
    }
    .stats { font-size: 0.72rem; color: #aaa; margin-left: auto; }
    .use-mask {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #use-mask { z-index: 21; }
    .use-mask.show { display: flex; }
    .use-box {
      width: min(420px, 96vw); max-height: 80vh; overflow: auto;
      background: #fff; border-radius: 12px; padding: 1rem 1.1rem 0.9rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }
    .use-box h3 { font-size: 0.95rem; color: #5d4037; margin-bottom: 0.7rem; }
    .use-box ul { list-style: none; font-size: 0.88rem; color: #444; }
    .use-box li { padding: 0.38rem 0; border-bottom: 1px solid #f0ece6; font-variant-numeric: tabular-nums; }
    .use-box li:last-child { border-bottom: none; }
    .use-box .empty { font-size: 0.82rem; color: #999; padding: 0.4rem 0 0.8rem; }
    .use-box .use-close { margin-top: 0.8rem; }
    .play-time { font-size: 1.6rem; font-weight: 700; color: #ef6c00; text-align: center; margin: 0.4rem 0 0.8rem; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .wallet {
      font-size: 0.72rem; color: #5d4037; font-weight: 600;
      background: #fff3e0; border: 1px solid #ffe0b2; border-radius: 6px;
      padding: 0.22rem 0.5rem; white-space: nowrap;
    }
    .routes {
      flex: 1 1 0; overflow: auto; min-height: 0;
      padding: 0.9rem 1rem 2.2rem; -webkit-overflow-scrolling: touch;
    }
    .routes-inner {
      width: min(1220px, 100%); margin: 0 auto;
      display: grid; grid-template-columns: 1.7fr 1fr 0.9fr 0.8fr;
      gap: 1.1rem 1rem; align-items: start;
    }
    .routes-inner.cols-3 { grid-template-columns: 1.15fr 1.15fr 0.85fr; }
    .routes-inner.cols-2 { grid-template-columns: 1fr 1fr; width: min(820px, 100%); }
    .routes-inner.cols-many { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 1000px) {
      .routes-inner, .routes-inner.cols-3, .routes-inner.cols-many { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .routes-inner, .routes-inner.cols-3, .routes-inner.cols-2, .routes-inner.cols-many { grid-template-columns: 1fr; }
    }
    .track-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 0.55rem; padding: 0 0.1rem;
    }
    .track-head h2 { font-size: 0.95rem; color: #5d4037; }
    .track-head .prog { font-size: 0.7rem; color: #999; }
    .graph { display: flex; flex-direction: column; padding-top: 0.85rem; }
    .g-row, .g-join {
      display: grid; grid-template-columns: 1fr; gap: 0.45rem;
    }
    .track.lanes-2 .g-row,
    .track.lanes-2 .g-join { grid-template-columns: 1fr 1fr; }
    .cell { display: flex; justify-content: center; min-width: 0; }
    .card {
      position: relative; display: block; text-decoration: none; color: inherit;
      margin-top: 0.55rem; padding: 1.15rem 0.5rem 0.5rem;
      width: 100%; min-height: 3.5rem; text-align: center;
      background: #fff; border: 1px solid #e8e4de; border-radius: 8px;
    }
    .card .face {
      position: absolute; top: -0.7rem; left: 50%;
      transform: translateX(-50%);
      font-size: 1.25rem; line-height: 1; pointer-events: none;
    }
    .card .grade {
      position: absolute; top: 0.3rem; right: 0.35rem;
      padding: 0 0.32rem; border-radius: 999px;
      font-size: 0.58rem; font-weight: 650; color: #5c6bc0; background: #e8eaf6;
    }
    .card .name { font-size: 0.86rem; font-weight: 650; color: #3d3228; line-height: 1.3; }
    .card .meta { font-size: 0.68rem; color: #9a8d80; margin-top: 0.14rem; }
    .card .tag {
      display: inline-block; margin-top: 0.22rem; padding: 0.04rem 0.35rem;
      border-radius: 999px; font-size: 0.62rem; font-weight: 650;
      background: #f3efe8; color: #8a7a6a;
    }
    .card.next { background: #fff8ee; border-color: #e8c48a; }
    .card.next .tag { background: #ef6c00; color: #fff; }
    .card.next .face { animation: hop 1.05s ease-in-out infinite; }
    .card.done { background: #f4faf1; border-color: #c8dfb8; }
    .card.done .tag { background: #e8f5e9; color: #2e7d32; }
    .card.known .tag { background: #fff3e0; color: #a67c3a; }
    .card.shut { filter: grayscale(0.78) saturate(0.2); }
    .card.full { cursor: default; }
    .card.idle { background: #faf8f5; border-style: dashed; opacity: 0.72; }
    .card.idle .face { filter: grayscale(1); }
    @keyframes hop {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }
    .g-join { min-height: 20px; }
    .stem {
      display: block; width: 2px; height: 18px; margin: 0 auto;
      background: #ddd;
    }
    .track.lanes-2 .g-row.one,
    .track.lanes-2 .g-join.merge { grid-template-columns: 1fr; }
    .g-join.merge svg { display: block; width: 100%; height: 24px; }
    .g-join.merge path { fill: none; stroke: #ddd; stroke-width: 2; }
  </style>
</head>
<body>
  <header class="header">
    <h1>人教版小学数学 · 先修知识树</h1>
    <p class="subtitle" id="edition-label"></p>
    <div class="toolbar">
      <span class="wallet" id="walletChip">积分 0</span>
      <button class="btn" id="deduct-btn" type="button">扣 5 分</button>
      <button class="btn" id="play-btn" type="button">玩 10 分钟</button>
      <button class="btn" id="use-log" type="button">使用记录</button>
      <span class="stats" id="stats"></span>
    </div>
  </header>
  <div class="routes" id="routes"></div>
  <div class="use-mask" id="use-mask">
    <div class="use-box">
      <h3>花积分开始时间</h3>
      <p class="empty" id="use-empty">还没有花积分玩过</p>
      <ul id="use-list"></ul>
      <button class="btn use-close" id="use-close" type="button">关闭</button>
    </div>
  </div>
  <div class="use-mask" id="play-mask">
    <div class="use-box">
      <h3>自由时间</h3>
      <p class="play-time" id="play-left">10:00</p>
      <p class="empty">这 10 分钟可以休息。到点后回来继续练习。</p>
      <button class="btn" id="play-use-log" type="button">使用记录</button>
      <a class="btn" href="../apps/dino.html">去玩抓恐龙</a>
    </div>
  </div>

  <script src="../pwa.js"></script>
  <script src="../practice-stats-config.js"></script>
  <script src="../practice-stats-store.js"></script>
  <script src="../play-wallet.js"></script>
  <script src="math-tree.js?v=5"></script>
  <script>
    const data = window.MATH_TREE;
    const defs = data.nodes;
    const CREDIT_LS = "ps-route-credit";
    const MASTERED = (window.PS_CONFIG && PS_CONFIG.masteredAt) || 90;

    function appHref(id) {
      const app = defs[id].app;
      return app + (app.includes("?") ? "&" : "?") + "node=" + encodeURIComponent(id);
    }

    function loadCredit() {
      try {
        const a = JSON.parse(localStorage.getItem(CREDIT_LS) || "[]");
        return new Set(Array.isArray(a) ? a : []);
      } catch (_) {
        return new Set();
      }
    }

    function saveCredit(set) {
      try { localStorage.setItem(CREDIT_LS, JSON.stringify([...set])); } catch (_) {}
    }

    function passed(s) {
      return !!(s && s.passed);
    }

    function mastered(s) {
      return s.proficiency != null && s.proficiency >= MASTERED;
    }

    function laterOf() {
      const kids = {};
      Object.keys(defs).forEach(id => {
        defs[id].deps.forEach(pre => {
          (kids[pre] = kids[pre] || []).push(id);
        });
      });
      return kids;
    }

    const KIDS = laterOf();
    PracticeStats.setDownstream(KIDS);

    function syncCredit() {
      const credit = loadCredit();
      let changed = false;
      Object.keys(defs).forEach(id => {
        if (!passed(PracticeStats.get(id))) return;
        const stack = [...defs[id].deps];
        while (stack.length) {
          const d = stack.pop();
          if (credit.has(d)) continue;
          credit.add(d);
          changed = true;
          defs[d].deps.forEach(x => stack.push(x));
        }
      });
      if (changed) saveCredit(credit);
      return credit;
    }

    function cleared(id, credit) {
      return !defs[id].app || passed(PracticeStats.get(id)) || credit.has(id);
    }

    function opened(id, credit) {
      const deps = defs[id].deps;
      if (!deps.length || cleared(id, credit)) return true;
      return deps.every(d => cleared(d, credit));
    }

    function laterPassed(id) {
      const stack = [...(KIDS[id] || [])];
      const seen = new Set();
      while (stack.length) {
        const cur = stack.pop();
        if (seen.has(cur)) continue;
        seen.add(cur);
        if (passed(PracticeStats.get(cur))) return true;
        (KIDS[cur] || []).forEach(x => stack.push(x));
      }
      return false;
    }

    const FACES = ["🐻", "🐥", "🦊", "🐼", "🐸", "🐯", "🐰", "🐨"];
    function faceOf(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      return FACES[(h >>> 0) % FACES.length];
    }

    function card(id, nextId, credit) {
      const def = defs[id];
      const gradeTag = `<span class="grade">${data.grades[def.grade]}</span>`;
      if (!def.app) {
        return `<div class="card idle"><span class="face" aria-hidden="true">${faceOf(id)}</span>${gradeTag}<div class="name">${def.name}</div><div class="meta">${def.unit}</div><div class="tag">练习稍后</div></div>`;
      }
      const s = PracticeStats.get(id);
      const did = passed(s);
      const known = !did && credit.has(id);
      const full = mastered(s);
      const locked = laterPassed(id);
      let cls = "card";
      let tag;
      if (!opened(id, credit)) cls += " shut";
      if (full || locked) {
        cls += " full";
        if (did) cls += " done";
        tag = did ? "已过" : "已会";
      }
      else if (did) { cls += " done"; tag = "复习"; }
      else if (known) { cls += " known"; tag = "已会"; }
      else if (id === nextId) { cls += " next"; tag = "下一关"; }
      else tag = s.total ? "进行中" : "可练";
      const meta = s.total
        ? `${s.total}题 · ${s.proficiency == null ? "—" : s.proficiency + "%"}`
        : known || locked ? "后面的关已经过了" : full ? "已经会了" : "点进去练";
      const body = `<span class="face" aria-hidden="true">${faceOf(id)}</span>${gradeTag}<div class="name">${def.name}</div><div class="meta">${meta}</div><div class="tag">${tag}</div>`;
      if (full || locked) return `<div class="${cls}">${body}</div>`;
      return `<a class="${cls}" href="${appHref(id)}">${body}</a>`;
    }

    function join(prev, row, lanes) {
      const svg = (d) => `<div class="g-join merge" aria-hidden="true"><svg viewBox="0 0 200 24" preserveAspectRatio="none">${d}</svg></div>`;
      const n = (a) => a.filter(Boolean).length;
      if (prev.length === 1 && row.length === 1) return svg(`<path d="M100 0 V24"/>`);
      if (n(prev) > 1 && row.length === 1) return svg(`<path d="M50 0 V12 H100 V24"/><path d="M150 0 V12 H100"/>`);
      if (prev.length === 1 && n(row) > 1) return svg(`<path d="M100 0 V12 H50 V24"/><path d="M100 12 H150 V24"/>`);
      if (n(prev) === 1 && n(row) > 1) {
        return prev[0]
          ? svg(`<path d="M50 0 V24"/><path d="M50 12 H150 V24"/>`)
          : svg(`<path d="M150 0 V24"/><path d="M150 12 H50 V24"/>`);
      }
      const stems = [];
      for (let c = 0; c < lanes; c++) {
        stems.push(`<div class="cell">${prev[c] && row[c] ? `<span class="stem"></span>` : ""}</div>`);
      }
      return `<div class="g-join" aria-hidden="true">${stems.join("")}</div>`;
    }

    function renderRoutes() {
      const credit = syncCredit();
      const routes = data.routes;
      const html = routes.map(route => {
        const ids = route.rows.flat().filter(Boolean);
        const nextId = ids.find(id => opened(id, credit) && !cleared(id, credit) && !mastered(PracticeStats.get(id))) || null;
        const live = ids.filter(id => defs[id].app);
        const done = live.filter(id => cleared(id, credit)).length;
        const prog = live.length ? `${done}/${live.length} 关` : "练习稍后";
        const lanes = Math.max(...route.rows.map(r => r.length));
        const body = route.rows.map((row, i) => {
          const one = row.length === 1;
          const cells = [];
          const n = one ? 1 : lanes;
          for (let c = 0; c < n; c++) {
            cells.push(`<div class="cell">${row[c] ? card(row[c], nextId, credit) : ""}</div>`);
          }
          return (i ? join(route.rows[i - 1], row, lanes) : "") + `<div class="g-row${one ? " one" : ""}">${cells.join("")}</div>`;
        }).join("");
        return `<section class="track${lanes > 1 ? " lanes-2" : ""}"><div class="track-head"><h2>${route.name}</h2><span class="prog">${prog}</span></div><div class="graph">${body}</div></section>`;
      }).join("");
      const cols = routes.length > 4 ? "many" : routes.length;
      document.getElementById("routes").innerHTML = `<div class="routes-inner cols-${cols}">${html}</div>`;
      document.getElementById("stats").textContent = routes.length + " 条路线";
    }

    function updateChrome() {
      document.getElementById("edition-label").textContent =
        data.edition + " · 从上往下打关 · 一条线从低年级接到高年级 · 右上角是年级";
      const w = window.PlayWallet ? PlayWallet.get() : 0;
      const cost = window.PlayWallet ? PlayWallet.COST : 40;
      document.getElementById("walletChip").textContent = "积分 " + w;
      const playBtn = document.getElementById("play-btn");
      const playing = window.PlayWallet && PlayWallet.isPlayActive();
      const left = playing ? PlayWallet.playLeftMs() : 0;
      playBtn.disabled = !playing && w + 1e-9 < cost;
      document.getElementById("deduct-btn").disabled = w + 1e-9 < 5;
      playBtn.textContent = playing
        ? "剩余 " + Math.floor(left / 60000) + ":" + String(Math.floor(left / 1000) % 60).padStart(2, "0")
        : "玩 10 分钟";
      syncPlayMask();
    }
    window.addEventListener("ps-wallet", updateChrome);
    window.addEventListener("ps-play", updateChrome);

    window.addEventListener("focus", () => {
      PracticeStats.refresh().then(renderRoutes);
    });

    window.addEventListener("pageshow", (e) => {
      if (!e.persisted) return;
      PracticeStats.refresh().then(renderRoutes);
    });

    function pad2(n) { return (n < 10 ? "0" : "") + n; }

    function fmtStart(t) {
      const d = new Date(t);
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate())
        + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }

    function hasNativePlay() {
      return !!(window.PrimarySchool && typeof PrimarySchool.startPlay === "function");
    }

    function syncPlayMask() {
      const mask = document.getElementById("play-mask");
      const on = window.PlayWallet && PlayWallet.isPlayActive() && !hasNativePlay();
      mask.classList.toggle("show", !!on);
      if (!on) return;
      const left = PlayWallet.playLeftMs();
      document.getElementById("play-left").textContent =
        Math.floor(left / 60000) + ":" + String(Math.floor(left / 1000) % 60).padStart(2, "0");
    }

    function showUseLog() {
      const a = (window.PlayWallet ? PlayWallet.starts() : []).slice().reverse();
      const empty = document.getElementById("use-empty");
      const list = document.getElementById("use-list");
      empty.style.display = a.length ? "none" : "block";
      list.innerHTML = a.map(t => "<li>" + fmtStart(t) + "</li>").join("");
      document.getElementById("use-mask").classList.add("show");
    }

    document.getElementById("deduct-btn").onclick = () => {
      if (!window.PlayWallet || PlayWallet.get() + 1e-9 < 5) return;
      PlayWallet.spend(5);
      updateChrome();
    };
    document.getElementById("play-btn").onclick = () => {
      if (!window.PlayWallet) return;
      if (PlayWallet.isPlayActive()) return;
      if (!PlayWallet.tryPlay()) return;
      updateChrome();
    };
    document.getElementById("use-log").onclick = showUseLog;
    document.getElementById("play-use-log").onclick = showUseLog;
    document.getElementById("use-close").onclick = () => {
      document.getElementById("use-mask").classList.remove("show");
    };
    document.getElementById("use-mask").onclick = e => {
      if (e.target.id === "use-mask") document.getElementById("use-mask").classList.remove("show");
    };
    setInterval(updateChrome, 1000);

    PracticeStats.init("../data/practice-stats.json").then(() => {
      updateChrome();
      renderRoutes();
    });
  </script>
</body>
</html>
